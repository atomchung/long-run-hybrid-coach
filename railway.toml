# Railway deployment settings for the Coach Gateway.
#
# Keep platform-specific policy here and the runtime artifact in Dockerfile. The service
# remains intentionally single-replica while the canonical store is a POSIX volume with
# SQLite, append-only JSON, and file locks. Railway can still overlap the old and new
# process during a rolling deploy. The gateway waits 35 seconds -- longer than the drain
# window below -- only when it actually observes a predecessor owner lock. Readiness also
# binds Railway's deployed source commit to the explicit Custom GPT release identity.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/readyz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
overlapSeconds = 0
drainingSeconds = 30
