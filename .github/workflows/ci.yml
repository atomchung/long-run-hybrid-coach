name: CI

# Pull requests and main are the correctness boundary: they run the complete suite.
# The production branch is only a release pointer. Its gate checks that the exact SHA
# is already the green main head and that its release identity is legal, so Railway's
# Wait for CI does not repeat the same 2,600+ tests. No live provider credentials and
# no private state are used here.
#
# One dependency is installed, and it is the same one the deployed image installs:
# requirements.txt pins the official MCP SDK, which owns the wire format `/mcp` speaks.
# Installing it here is what makes the transport tests and the contract-equivalence gate
# run against the protocol implementation production actually serves, rather than skip.

on:
  pull_request:
  push:
    branches:
      - main
      - production

permissions:
  contents: read
  actions: read

# A superseded pull-request run is wasted work. A superseded `main` run is not: the
# promotion gate asks whether one exact SHA has a completed, successful `main` push run,
# and a commit whose run was cancelled can never answer that -- including the commit a
# rollback wants to promote. So only pull requests cancel.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: Unit tests and repo safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The contract-equivalence gate builds the base ref's served surface out of
          # Git, so the base commit has to be present; the default shallow clone has
          # only this one.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install the runtime dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run the unit test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      # The reviewed model-facing surface, compared byte for byte between the base ref
      # and this checkout, through both protocol eras. A transport change that moved a
      # tool name, a schema, an annotation or the served instructions fails here.
      - name: Check MCP contract equivalence
        run: python3 scripts/mcp_contract_equivalence.py --base origin/${{ github.base_ref || 'main' }}

      - name: Run the repository safety check
        run: python3 scripts/check_repo_safety.py

      # No test or safety script is expected to modify the working tree or leave
      # generated files behind; a diff here means one silently did.
      - name: Confirm the working tree is still clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The working tree changed during the run:"
            git status --porcelain
            git diff
            exit 1
          fi

  promotion:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    name: Verify main green and release identity
    runs-on: ubuntu-latest
    steps:
      - name: Check out the promoted commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # The promotion gate builds a release identity, which reads the served tool
      # catalogue out of the gateway module -- and that module now imports the MCP SDK.
      # Without this the gate cannot import at all, which fails safe (nothing deploys)
      # but fails every promotion rather than judging one.
      - name: Install the runtime dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify exact main CI and release identity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify_production_promotion.py

      - name: Run the repository safety check
        run: python3 scripts/check_repo_safety.py

      # No gate is expected to modify the working tree or leave generated files behind.
      - name: Confirm the working tree is still clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The working tree changed during the run:"
            git status --porcelain
            git diff
            exit 1
          fi
