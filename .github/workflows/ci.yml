name: CI

# Every pull request, and every push to main or the explicit production promotion lane,
# must show one visible pass/fail check from a clean checkout. No live provider
# credentials and no private state are used here, and nothing is installed: the
# product is stdlib-only (AGENTS.md) and so is everything that checks it. Every
# fixture the test suite reads is anonymous and already committed.

on:
  pull_request:
  push:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and repo safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the unit test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run the repository safety check
        run: python3 scripts/check_repo_safety.py

      # No test or safety script is expected to modify the working tree or leave
      # generated files behind; a diff here means one silently did.
      - name: Confirm the working tree is still clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The working tree changed during the run:"
            git status --porcelain
            git diff
            exit 1
          fi
