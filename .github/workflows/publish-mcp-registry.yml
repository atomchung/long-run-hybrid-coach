name: Publish to MCP registry

# Source merge is not a deployment receipt. Dispatch only after production promotion;
# both jobs independently verify /readyz against the exact workflow commit and digests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publication
  cancel-in-progress: false

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify production source, version and release digests
        run: python3 scripts/verify_registry_release.py

  publish:
    needs: verify-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the pinned publisher after archive verification
        # v1.8.1 upstream registry_1.8.1_checksums.txt and release asset digest agree.
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz' \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Recheck production immediately before publication
        run: python3 scripts/verify_registry_release.py
      - name: Authenticate with GitHub OIDC and publish
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
