openapi: 3.1.0
info:
  title: Coach Gateway
  version: "1.0"
  description: Agent-neutral HTTP surface over one athlete's own Coach Loop PlanState.
servers:
  - url: https://YOUR-GATEWAY-DOMAIN
    description: Replace with your HTTPS tunnel or host; never commit a real domain.
security:
  - intervalsOAuth:
      - "ACTIVITY:READ"
      - "WELLNESS:READ"
      - "CALENDAR:WRITE"
      - "SETTINGS:WRITE"
paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Runtime identity readiness check
      description: Call only to verify the gateway is reachable and its release plus privacy-safe deployment configuration identities are bound; needs no authentication and returns no private configuration values.
      security: []
      x-openai-isConsequential: false
      responses:
        "200":
          description: The gateway is reachable, with explicit ready or blocked runtime identity state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: readinessCheck
      summary: Deployment readiness gate
      description: Platform-facing gate for the same privacy-safe runtime identity body; returns a non-success status when source, release, or deployment identity is not bound.
      security: []
      x-openai-isConsequential: false
      responses:
        "200":
          description: The deployed source, release and deployment configuration identities are bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The process is live but is not the certified production release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/coach/session:
    post:
      operationId: startCoachSession
      summary: Start or refresh the current coaching session
      description: Call before answering any today, this-week, plan, or reassessment question; the returned PlanState is the only durable memory across conversations.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: The current PlanState and a freshly built CoachContext, or an explicit no-plan-state answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/state:
    get:
      operationId: getCoachState
      summary: Read the stored plan summary, with no provider call
      description: Call for a plain status check -- current plan id, version, week and delivery summary. Zero writes, zero Intervals calls, and it cannot reconcile; call startCoachSession instead when the answer needs fresh evidence.
      x-openai-isConsequential: false
      responses:
        "200":
          description: The current stored PlanState summary, or an explicit no-plan-state answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachStateResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/permissions:
    get:
      operationId: inspectIntervalsPermissions
      summary: Safely inspect the connected Intervals permission state
      description: Call only when debugging a connection. Reads Settings and the calendar once each and classifies what the provider allowed now; the recorded scope list is only what the token said when it was issued. Never returns provider settings, calendar contents, or credentials.
      x-openai-isConsequential: false
      responses:
        "200":
          description: The live SETTINGS and calendar read classifications, plus the scope list recorded when this connection was authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDiagnosticResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/profile:
    post:
      operationId: recordAthleteProfile
      summary: Remember the athlete's own timezone and language
      description: Call when the athlete says where they are or which language they want their plan in. Needs no confirmation and does not modify PlanState. Send only what they stated; the other field stays as it was. Stored once and used by every later call.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteProfileRequest"
      responses:
        "200":
          description: What is now stored, plus the timezone and language in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteProfileResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/availability:
    post:
      operationId: recordAthleteAvailability
      summary: Remember which weekdays the athlete can train
      description: Call when the athlete states available or unavailable days. Needs no confirmation and does not modify PlanState. Send only the stated week or recurring days; omitted days stay unchanged. Re-sending the same report is idempotent.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRecordRequest"
      responses:
        "200":
          description: What is now stored, plus the availability in force for the current week.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityRecordResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/long-term-goal:
    post:
      operationId: recordLongTermGoal
      summary: Remember what the athlete is training for beyond this cycle
      description: Call when the athlete states something they are training for past the current cycle -- a body weight, a VO2max, a race time, a lift. Needs no confirmation and does not modify PlanState; it outlives every cycle. Never call it for a current measurement or an unstated change.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LongTermGoalRequest"
      responses:
        "200":
          description: The stored goal, and what a restatement displaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongTermGoalResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/training-preference:
    post:
      operationId: recordTrainingPreference
      summary: Remember a training habit the athlete states
      description: Call when the athlete states a training habit, e.g. 習慣週五品質跑. Needs no confirmation and does not modify PlanState. Store only what they stated, never inferred from history; a preference guides planning, not a rule. A one-week constraint is recordAthleteAvailability's week note instead.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingPreferenceRequest"
      responses:
        "200":
          description: The stored preference, and what a restatement displaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingPreferenceResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/strength-report:
    post:
      operationId: recordStrengthExecution
      summary: Remember one lift the athlete reports having done
      description: Call when the athlete reports completed strength sets. Needs no confirmation and does not modify PlanState. Send only stated values; never infer missing load or reps. Re-send the same movement/day to correct it; identical reports are idempotent.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrengthReportRequest"
      responses:
        "200":
          description: The stored report, and whether this exact report was already held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrengthReportResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/body-measurement:
    post:
      operationId: recordBodyMeasurement
      summary: Remember what the athlete weighed on one day
      description: Call when the athlete states a weight or body fat reading. The record is written immediately and echoed back, which is their chance to correct it by restating; no confirmation, and PlanState does not change. One record per day; omitted figures are kept.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyMeasurementRequest"
      responses:
        "200":
          description: The stored measurement, and what a restatement displaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyMeasurementResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/activity-summary:
    post:
      operationId: recordActivitySummary
      summary: Remember a session no device recorded
      description: Call when the athlete reports training no watch captured. Echoed back immediately; no confirmation, no PlanState change, nothing written to Intervals, never completes a planned session. One summary per sport per day; two sessions combine.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivitySummaryRequest"
      responses:
        "200":
          description: The stored summary, and what a restatement displaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySummaryResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/record/retract:
    post:
      operationId: retractAthleteRecord
      summary: Take back a stored self-reported record
      description: "Call when the athlete states a stored self-reported record should not stand -- 其實那天沒練 / that entry was wrong. This is removal, not correction: a correction re-sends the matching record operation instead. Restating the same record later re-creates it."
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetractRecordRequest"
      responses:
        "200":
          description: What was removed, or that nothing on record matched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetractRecordResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/history/import:
    post:
      operationId: importAthleteHistory
      summary: Import training history from a file the athlete uploaded
      description: "Call when the athlete uploads training history -- a Strava, Intervals.icu or Garmin Connect CSV, an Apple Health export, or a .fit file. Send the file's own text (base64 for .fit); do not transcribe rows. Duplicates are skipped silently; only real ambiguities come back to answer."
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportHistoryRequest"
      responses:
        "200":
          description: What was added, merged, skipped, and what still needs an answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportHistoryResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/strength-prescribed:
    post:
      operationId: confirmPrescribedStrength
      summary: Record a planned strength session as done, with whatever differed
      description: Call when the athlete says a planned strength session was completed. Send session_id and only named deviations; unmentioned sets stay prescribed. Needs no confirmation, does not modify PlanState, and is idempotent. Use recordStrengthExecution for unplanned, skipped, or swapped movements.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescribedStrengthRequest"
      responses:
        "200":
          description: What was recorded for each movement, and whether this was already held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescribedStrengthResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/initialization/prepare:
    post:
      operationId: prepareCoachInitialization
      summary: Preview the first plan for an account that has none
      description: Call only after startCoachSession returned no_plan_state, with one small initialization_request built from what the athlete told you; returns the exact first plan to show them before asking for one confirmation, and writes nothing.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializationPrepareRequest"
      responses:
        "200":
          description: The exact first plan that would be committed, bound to a proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializationPrepareResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/initialization/apply:
    post:
      operationId: initializeCoachPlan
      summary: Commit the confirmed first plan
      description: Call immediately after the athlete confirms the preview from prepareCoachInitialization, with the identical initialization_request and the returned proposal, to create this account's PlanState.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializationApplyRequest"
      responses:
        "200":
          description: The created PlanState, or the prior success if this exact initialization already ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializationApplyResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/decision/prepare:
    post:
      operationId: prepareCoachDecision
      summary: Preview a weekly plan change
      description: Call once a weekly change is needed, with one small change_request; returns the exact before/after values to show the athlete before asking for one confirmation, and writes nothing.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionPrepareRequest"
      responses:
        "200":
          description: The exact before/after values of the projected change, bound to a proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionPrepareResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/decision/apply:
    post:
      operationId: applyCoachDecision
      summary: Commit a confirmed weekly plan change
      description: Call immediately after the athlete confirms the preview from prepareCoachDecision, with the identical context and change_request plus the returned proposal, to commit the new PlanState version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionApplyRequest"
      responses:
        "200":
          description: The committed PlanState version, or the prior success if this exact decision was already applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionApplyResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/delivery/prepare:
    post:
      operationId: prepareWorkoutDelivery
      summary: Preview workouts selected for delivery, or superseded ones for withdrawal
      description: "Build the exact preview before asking for one confirmation; writes nothing. For a pace workout, settings_changes may include a missing Run threshold pace. Set withdraw: true to preview removing superseded product-owned workouts instead."
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryPrepareRequest"
      responses:
        "200":
          description: The exact preview batch and an opaque delivery_set bound to a proposal_hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryPrepareResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/delivery/apply:
    post:
      operationId: applyWorkoutDelivery
      summary: Apply a confirmed workout delivery or withdrawal
      description: After confirmation, send the same delivery_set and proposal_hash unchanged. Applies its delivery or withdrawal direction. A confirmed setting correction is written and read back before any workout; only product-owned events are removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryApplyRequest"
      responses:
        "200":
          description: Delivery evidence observed up to intervals_accepted, or the events verified gone -- whichever direction was applied. Never means Garmin Connect or the watch received the workout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryApplyResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/delivery/attempt/clear:
    post:
      operationId: clearDeliveryAttempt
      summary: Give up on an unfinished delivery so the plan can change again
      description: Call only for delivery.unresolved_delivery when the identical set cannot be retried and the athlete confirmed after checking Intervals. Requires confirmation; clears the pending attempt but does not reconcile Intervals or modify PlanState.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryAttemptClearRequest"
      responses:
        "200":
          description: The reservation is released, or there was none to release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAttemptClearResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/data/export:
    get:
      operationId: exportOwnerData
      summary: Give the athlete a copy of their own data
      description: "Call when the athlete asks what this product holds about them, or for a copy of it. Returns their plan history, decisions and reported evidence, and never a credential, a fingerprint, or another athlete's data. Takes no input: the connection decides whose archive this is."
      x-openai-isConsequential: false
      responses:
        "200":
          description: This owner's whole archive, with what it deliberately excludes named in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDataExportResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/data/deletion/prepare:
    get:
      operationId: prepareOwnerDeletion
      summary: Preview what deleting this account removes
      description: Call when the athlete asks to delete their data, to show exactly what would go and what deletion cannot reach, before asking for one confirmation. Writes nothing.
      x-openai-isConsequential: false
      responses:
        "200":
          description: What a confirmed deletion removes, what it cannot reach, and the proposal that binds it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDeletionPrepareResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/data/deletion/apply:
    post:
      operationId: applyOwnerDeletion
      summary: Permanently erase this account
      description: Call immediately after the athlete confirms the preview from prepareOwnerDeletion, with the returned proposal. Permanently erases this account's plan, history and reported evidence; it cannot be undone, and it removes nothing from their Intervals calendar or authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerDeletionApplyRequest"
      responses:
        "200":
          description: The erasure receipt, naming counts and what deletion did not reach.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDeletionApplyResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    intervalsOAuth:
      type: oauth2
      description: The token URL is this gateway's own OAuth proxy, not Intervals' token endpoint; the client secret never leaves the gateway.
      flows:
        authorizationCode:
          authorizationUrl: https://intervals.icu/oauth/authorize
          tokenUrl: https://YOUR-GATEWAY-DOMAIN/oauth/intervals/token
          scopes:
            "ACTIVITY:READ": Read the athlete's Intervals.icu activities.
            "WELLNESS:READ": Read the athlete's Intervals.icu wellness data.
            "CALENDAR:WRITE": Read the athlete's Intervals.icu calendar and write workouts to it.
            "SETTINGS:WRITE": Read sport settings used to resolve workout targets and, only after the same delivery confirmation, fill a missing Run threshold pace required to preserve pace targets on export.
  schemas:
    OwnerDataExportResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        archive_version:
          type: string
        owner_reference:
          type: string
          description: An opaque, deployment-keyed handle for this account. Quote it when asking an operator about a request; it is not the internal owner id and cannot be turned into one.
        identity:
          type: object
          description: Counts only. What is held is the athlete's question; what the rows say never travels. Reports the same five identity-table row counts, under the same key names, as prepareOwnerDeletion's removes.identity_rows, so the two cannot disagree about what is held.
          properties:
            provider:
              type: string
            owners:
              type: integer
            provider_identities:
              type: integer
            token_fingerprints:
              type: integer
            token_scopes:
              type: integer
            owner_revocations:
              type: integer
            revoked_after:
              type: [string, "null"]
              description: ISO-8601 UTC instant this owner's connections were last revoked with revoke-connections, or null if that has never happened.
            token_scope_names:
              type: array
              description: Distinct sets of OAuth scope names granted across this owner's live connections. Non-secret metadata about what a connection may do; never says which connection holds which set.
              items:
                type: array
                items:
                  type: string
        plan_state:
          type: [object, "null"]
          description: Null when this account has never had a plan, which is stated in unknowns rather than implied by an empty archive.
          additionalProperties: true
        decision_history:
          type: array
          items:
            type: object
            additionalProperties: true
        athlete_evidence:
          type: object
          description: Everything the athlete stated themselves — profile, availability, reported sets, measurements and sessions, and the long-term goals and training habits that outlive any one cycle.
          additionalProperties: true
        unresolved_delivery:
          type: [string, "null"]
        excluded:
          type: array
          description: What this archive deliberately does not contain, and why. Read it out rather than implying the archive is everything.
          items:
            type: string
        unknowns:
          type: array
          items:
            type: string
      required:
        - status
        - archive_version
        - owner_reference
        - plan_state
        - excluded
    OwnerDeletionRemovals:
      type: object
      properties:
        plan_id:
          type: [string, "null"]
        plan_versions:
          type: integer
        reported_strength_sessions:
          type: integer
        body_measurements:
          type: integer
        reported_activities:
          type: integer
        reported_availability:
          type: boolean
        stored_profile:
          type: boolean
        long_term_goals:
          type: integer
          description: How many long-term goals this athlete has on record. Named here rather than left to the store directory going away with everything else — it is among the longest-lived things they ever stated.
        training_preferences:
          type: integer
          description: How many stated training habits this athlete has on record.
        stored_snapshots:
          type: boolean
        identity_rows:
          type: object
          additionalProperties: true
    OwnerDeletionPrepareResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        proposal:
          type: string
          description: Hand this back unchanged to applyOwnerDeletion. It binds the exact account summary the athlete was shown.
        expires_at:
          type: string
        confirmation_required:
          type: boolean
        removes:
          $ref: "#/components/schemas/OwnerDeletionRemovals"
        not_removed:
          type: array
          description: What deletion here cannot reach. Say all of it before asking for the confirmation.
          items:
            type: string
        reversible:
          type: boolean
      required:
        - status
        - proposal
        - confirmation_required
        - removes
        - not_removed
    OwnerDeletionApplyRequest:
      type: object
      required:
        - proposal
        - confirmed
      properties:
        proposal:
          type: string
          description: The exact proposal returned by prepareOwnerDeletion, unchanged. An account that has gained a plan version or a reported session since that preview is refused rather than erased.
        confirmed:
          type: boolean
          description: Must be true. Set only after showing the athlete the preview, including what deletion cannot reach, and hearing them agree.
    OwnerDeletionApplyResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        deleted:
          type: boolean
          description: False when there was nothing left to remove, which is the normal answer to a repeated call. Never an error.
        receipt_id:
          type: string
        removed:
          type: object
          description: "Counts and flags only. state_written_during_deletion is true when something wrote to the account while it was being deleted; the write was swept, and you are told rather than left to find out."
          additionalProperties: true
        not_removed:
          type: array
          items:
            type: string
      required:
        - status
        - deleted
        - receipt_id
        - not_removed
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        error:
          type: [string, "null"]
        api_version:
          type: string
        release_identity:
