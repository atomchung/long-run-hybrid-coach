        - release_identity
        - deployment_identity
        - source_git_commit
    ValidationSummary:
      type: object
      properties:
        status:
          type: string
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    PermissionDiagnosticResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        scopes_recorded_at_authorization:
          type: [array, "null"]
          items:
            type: string
          description: What the token response said when this connection was made. Provenance, never a live capability - a token recorded with CALENDAR:WRITE can still be refused the calendar.
        settings_read:
          type: string
          enum: [readable, denied, invalid_or_expired]
          description: What the provider answered to one Settings read, just now.
        calendar_read:
          type: string
          enum: [readable, denied, invalid_or_expired]
          description: What the provider answered to the same calendar read a delivery performs, just now. denied means delivery cannot work until the athlete reconnects and grants calendar access.
      required:
        - status
        - api_version
        - generated_at
        - scopes_recorded_at_authorization
        - settings_read
        - calendar_read
    SessionRequest:
      type: object
      description: Every field is optional. Omission means "not confirmed this turn", never a convenient default.
      properties:
        as_of:
          type: [string, "null"]
          description: ISO-8601 instant to evaluate the plan as of; defaults to the current time.
        timezone:
          type: string
          description: Overrides the athlete's stored timezone for this call only, e.g. while they are travelling. Omit it otherwise, because their stored profile already decides what "today" means.
        available_days:
          type: array
          items:
            type: string
          description: Confirmed available weekday names for this week (e.g. mon, tue); omit when not yet confirmed.
        session_minutes:
          type: [integer, "null"]
          description: Confirmed minutes available for today's session.
        red_flags:
          type: object
          description: Tri-state per symptom -- true, false, or omitted/null for unassessed. Never infer a value the athlete did not give.
          properties:
            pain:
              type: [boolean, "null"]
            illness:
              type: [boolean, "null"]
            chest_pain:
              type: [boolean, "null"]
            dizziness:
              type: [boolean, "null"]
            unusual_symptoms:
              type: [boolean, "null"]
        all_clear:
          type: boolean
          description: Shorthand for "no red flags reported"; sets every red_flags entry not otherwise given to false.
        leg_fatigue:
          type: string
          enum: [normal, elevated, severe, unknown]
          description: Defaults to unknown.
        soreness:
          type: string
          enum: [normal, elevated, severe, unknown]
          description: Defaults to unknown.
        schedule_changed:
          type: [boolean, "null"]
        equipment_changed:
          type: [boolean, "null"]
        unknowns:
          type: array
          items:
            type: string
          description: Additional athlete-reported unknowns to carry into the context.
        recovery_signals:
          $ref: "#/components/schemas/RecoverySignalsUpload"
    RecoverySignalsUpload:
      type: [object, "null"]
      additionalProperties: false
      description: Optional sanitized recovery evidence that this client already read on the athlete's own machine. Send values only -- never a database path, credential, raw provider payload, estimate, readiness score invented by the model, or athlete statement translated into a device reading. Send at most the current seven observed days; the gateway derives the exact window from this session, labels the declared source as client-uploaded, and keeps it only in this CoachContext. Omission stays unknown and never blocks ordinary coaching.
      required:
        - source
        - days
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.:+-]*$"
          description: The local adapter or export the client actually read, e.g. personal-os:recovery_daily+daily_metrics. Use a short adapter label, never a path, URL, credential, or note. This is declared provenance, not a provider observation made by the hosted gateway.
        days:
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/RecoverySignalsDayUpload"
    RecoverySignalsDayUpload:
      type: object
      additionalProperties: false
      required:
        - date
        - readiness_score
        - readiness_level
        - hrv_status
        - hrv_7d_avg_ms
        - acute_load
        - recovery_time_sec
        - body_battery_high
        - body_battery_low
        - avg_stress
      properties:
        date:
          type: string
          format: date
        readiness_score:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        readiness_level:
          type: [string, "null"]
          minLength: 1
        hrv_status:
          type: [string, "null"]
          minLength: 1
        hrv_7d_avg_ms:
          type: [number, "null"]
          exclusiveMinimum: 0
        acute_load:
          type: [number, "null"]
          minimum: 0
        recovery_time_sec:
          type: [number, "null"]
          minimum: 0
        body_battery_high:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        body_battery_low:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        avg_stress:
          type: [number, "null"]
          minimum: 0
          maximum: 100
    SessionResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed, no_plan_state]
        api_version:
          type: string
        generated_at:
          type: string
        context_id:
          type: [string, "null"]
        plan_state:
          type: object
          properties:
            present:
              type: boolean
            plan_id:
              type: [string, "null"]
            plan_version:
              type: [integer, "null"]
            current_plan:
              type: [object, "null"]
              additionalProperties: true
              description: The full current PlanState. Opaque -- read the fields you need to reason about it; never hand-edit or reconstruct it.
        context:
          type: [object, "null"]
          additionalProperties: true
          description: >-
            The full CoachContext for this turn. Read the fields you need to reason about;
            never hand-edit or reconstruct it, and pass it back verbatim as `context` to
            prepareCoachDecision and applyCoachDecision. `cycle_sessions` is this cycle's
            planned-versus-actual record: one row per prescribed session whose day has
            passed (today is not in it -- read today from `current_calendar` and
            `recent_actuals`), each carrying its prescription beside whatever came back for
            it. Its `activity_evidence` says why that activity is what it is: `attached`
            means an activity was matched to this session and says nothing about how it
            went; `none_found` means this build read that day and no activity of that sport
            attached; `athlete_reported` means no device recorded it and the athlete says
            they trained it, which is training rather than a missed session, though it does
            not say the prescription was completed; `other_activity_same_day` means that
            sport was trained that day but attached elsewhere, which is a matching question
            and not a missed session; `outside_evidence_window` means the day predates
            anything this build read. `match_status` is the PlanState's own value for the
            session -- no completion percentage, and no status derived from a ratio:
            `planned` means nothing has settled it yet; `completed` means the matched
            activity was accepted as trained, not that it went well; `partial` means an
            activity attached but read against the prescription as started, not finished;
            `missed` means nothing was ever accepted as trained; `moved` and `replaced` mean
            a later plan change touched the session's schedule or its content, not its
            execution. These are observations, not conclusions. What an absence or a
            shortfall means, and what should change because of it, is a coaching judgment
            made from the goal, availability, recovery, constraints, the athlete's own
            account, and the rest of the cycle -- never read off one field, and never a
            threshold or a percentage. `average_hr` and `average_pace_sec_per_km` are
            whole-activity averages spanning warm-up and recoveries, so on a session that
            prescribed structure they are not a reading of the work.
        validation:
          type: [object, "null"]
          properties:
            status:
              type: string
            errors:
              type: array
              items:
                type: string
            warnings:
              type: array
              items:
                type: string
        unknowns:
          type: array
          items:
            type: string
        delivery:
          type: [object, "null"]
          properties:
            max_delivery_state:
              type: string
              description: The furthest delivery evidence this product can ever observe.
            sessions:
              type: array
              items:
                type: object
                properties:
                  session_id:
                    type: string
                  scheduled_date:
                    type: string
                  sport:
                    type: string
                  match_status:
                    type: string
                  publish_supported:
                    type: [boolean, "null"]
                  delivery_state:
                    type: [string, "null"]
                  external_id:
                    type: [string, "null"]
                  superseded_external_id:
                    type: [string, "null"]
                    description: An Intervals event a confirmed change left on the calendar. When present, Intervals still shows the athlete a workout the plan no longer describes; offer prepareWorkoutDelivery with withdraw true, or publish the session's current content, which replaces that same event.
            unresolved_delivery:
              type: [object, "null"]
              description: A delivery this account started and could not finish. When present, no plan change is possible until it is resolved, and Intervals may hold a workout the plan does not describe. Tell the athlete before doing anything else, and resolve it by retrying the identical set if this conversation still has it, or by clearDeliveryAttempt once they have checked their calendar.
              properties:
                attempt_id:
                  type: string
                  description: Pass this back to clearDeliveryAttempt. It is the only accepted identification of this reservation.
                kind:
                  type: string
                  description: delivery when the unfinished set was writing workouts, withdrawal when it was removing them.
                opened_at:
                  type: string
                plan_id:
                  type: string
                plan_version:
                  type: integer
                  description: The plan version this delivery was bound to.
                session_ids:
                  type: array
                  description: Every session the unfinished set covered.
                  items:
                    type: string
                provider_effects_outstanding:
                  type: boolean
                  description: True when at least one operation may already have reached Intervals; those are listed under operations. False means nothing reached Intervals and only the block itself remains.
                next_actions:
                  type: array
                  description: What may be done from here - retry_same_set, or clear_delivery_attempt via clearDeliveryAttempt. Retrying is always preferred; it converges without writing anything twice.
                  items:
                    type: string
                operations:
                  type: array
                  description: The operations Intervals may hold that this plan does not record. Empty when nothing reached Intervals.
                  items:
                    type: object
                    properties:
                      session_id:
                        type: string
                      operation:
                        type: string
                        description: upsert for a workout write, delete for a withdrawal.
                      state:
                        type: string
                        description: How far this operation got before it stopped.
                      external_id:
                        type: [string, "null"]
                        description: The Intervals event this operation may have created or removed, when one is known.
        reconciliation:
          type: [object, "null"]
          additionalProperties: true
          description: The deterministic planned-vs-actual reconciliation applied during this refresh. status is deferred when an unresolved delivery blocked it - the plan is still correct as reported, but a session that was trained may still read as planned until the delivery is resolved.
        pre_plan_observations:
          type: [object, "null"]
          description: Present only when status is no_plan_state. What is already on record for an athlete with no plan; read it before asking, and ask only for what is missing.
          properties:
            athlete_evidence:
              type: [object, "null"]
              additionalProperties: true
              description: Availability, lifts, measurements and reported sessions this athlete already stated, or null when they have reported nothing.
            recent_training:
              type: [object, "null"]
              additionalProperties: true
              description: Recent activities read from Intervals, or null when that read failed -- in which case unknowns says so. Never treat null as "this athlete has not trained".
            recovery_signals:
              type: [object, "null"]
              additionalProperties: true
              description: Sanitized request-scoped recovery values this client supplied, or null when it supplied none. The gateway never reads a local database and does not retain this group.
    CoachStateResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed, no_plan_state]
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: [string, "null"]
        plan_version:
          type: [integer, "null"]
        cycle:
          type: [object, "null"]
          properties:
            start:
              type: string
            end:
              type: string
            outlook_weeks:
              type: integer
              description: How many further weeks this cycle has outlined beyond the current one.
        week:
          type: [object, "null"]
          properties:
            start:
              type: string
            intent:
              type: string
            session_count:
              type: integer
        goal:
          type: [object, "null"]
          additionalProperties: true
          description: The same goal object startCoachSession's plan_state.current_plan.goal carries.
        delivery:
          type: [object, "null"]
          properties:
            max_delivery_state:
              type: string
              description: The furthest delivery evidence this product can ever observe.
            sessions:
              type: array
              items:
                type: object
                properties:
                  session_id:
                    type: string
                  scheduled_date:
                    type: string
                  sport:
                    type: string
                  match_status:
                    type: string
                  publish_supported:
                    type: [boolean, "null"]
                  delivery_state:
                    type: [string, "null"]
                  external_id:
                    type: [string, "null"]
                  superseded_external_id:
                    type: [string, "null"]
        pending_delivery_attempt_id:
          type: [string, "null"]
          description: Pass this to clearDeliveryAttempt. Present only when a delivery this account started could not finish; call startCoachSession for the reservation's full detail.
        unknowns:
          type: array
          items:
            type: string
          description: What a stored-state read cannot know, such as the freshness of provider evidence -- never a claim that nothing changed on Intervals.
      required:
        - status
        - api_version
        - generated_at
        - plan_id
        - plan_version
        - unknowns
    AthleteProfileRequest:
      type: object
      description: At least one of timezone and language is required. Send only what the athlete stated; the other one keeps whatever it held.
      properties:
        timezone:
          type: string
          description: The IANA timezone the athlete lives in, e.g. Europe/Berlin. Decides what today and the next session mean everywhere else.
        language:
          type: string
          enum: [zh-Hant, en]
          description: The language their prescriptions are written in, which reaches their watch. Movement names stay in the athlete's own words either way.
    AthleteProfileResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed]
        api_version:
          type: string
        generated_at:
          type: string
        athlete_evidence_version:
          type: integer
        profile:
          type: object
          additionalProperties: true
          description: The profile now stored, with when it was recorded. A field the athlete has never stated is null.
        effective:
          type: object
          additionalProperties: true
          description: The timezone and language now in force, including any default still standing in for an unstated field.
      required:
        - status
        - api_version
        - generated_at
        - athlete_evidence_version
        - profile
        - effective
    AvailabilityRecordRequest:
      type: object
      description: At least one of recurring and week is required. Weekday names are mon, tue, wed, thu, fri, sat, sun.
      properties:
        timezone:
          type: string
          description: Overrides the athlete's stored timezone for this call only. It decides which week is the current one; omit it to use their stored one.
        recurring:
          type: object
          description: The athlete's normal week, which stands until they say otherwise. Sending it again replaces the previous one.
          properties:
            available_days:
              type: array
              items:
                type: string
              description: Weekdays the athlete can train.
            unavailable_days:
              type: array
              items:
                type: string
              description: Weekdays the athlete cannot train. Never fill this in as the complement of available_days; send only days the athlete actually named.
        week:
          type: object
          description: One week, layered onto the athlete's normal week rather than replacing it. A day lost or gained goes in available_days/unavailable_days and the rest of the standing week is untouched; "this week I can only do X and Y" is only_days instead, the week restated in full. only_days is mutually exclusive with the two day lists.
          properties:
            week_start:
              type: string
              description: Optional, and rarely needed. Any ISO date inside the target week; defaults to the current week.
            available_days:
              type: array
              items:
                type: string
              description: Weekdays gained this week, on top of the athlete's normal week.
            unavailable_days:
              type: array
              items:
                type: string
              description: Weekdays lost this week, out of the athlete's normal week.
            only_days:
              type: array
              items:
                type: string
              description: This week in full, replacing the normal week for this week only. Mutually exclusive with available_days and unavailable_days.
            note:
              type: string
              description: "One thing about this week that is not a weekday: travelling, a hotel gym, a week that will run late. Send it alone when no day is lost. It applies to this week only and expires with it -- a habit that keeps standing is recordTrainingPreference instead."
    AvailabilityRecordResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed]
        api_version:
          type: string
        generated_at:
          type: string
        athlete_evidence_version:
          type: integer
        recurring:
          type: [object, "null"]
          additionalProperties: true
          description: The normal week now stored, with when it was recorded.
        week:
          type: [object, "null"]
          additionalProperties: true
          description: The single-week statement just recorded, when this call made one.
        effective_this_week:
          type: [object, "null"]
          additionalProperties: true
          description: The availability in force for the current week, after this call. Read it back to the athlete rather than restating what you sent.
      required:
        - status
        - api_version
        - generated_at
        - athlete_evidence_version
        - recurring
        - week
        - effective_this_week
    LongTermGoalRequest:
      type: object
      required:
        - metric
        - target
      properties:
        metric:
          type: string
          description: "What they are aiming at, in their own words: 體重, VO2max, 5K. Restating the same metric replaces the goal on record for it."
        target:
          type: string
          description: "Where they want it, exactly as they said it: \"50\", \"80 kg\", \"sub-25:00\". Never a current value, and never converted."
        target_date:
          type: string
          description: Optional ISO date they named. Omit when they named none.
        note:
          type: string
          description: Optional; anything else they said about this goal.
    LongTermGoalResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed]
        api_version:
          type: string
        generated_at:
          type: string
        athlete_evidence_version:
          type: integer
        goal:
          type: object
          additionalProperties: true
          description: The stored goal, including when it was recorded. Read it back to the athlete rather than restating what you sent.
        replaced:
          type: [object, "null"]
          additionalProperties: true
          description: The goal this one displaced, when restating the same metric replaced an earlier target. Null when it replaced nothing.
        long_term_goals:
          type: array
          description: Every long-term goal now on record for this athlete.
          items:
            type: object
            additionalProperties: true
      required:
        - status
        - api_version
        - generated_at
        - athlete_evidence_version
        - goal
        - replaced
        - long_term_goals
    TrainingPreferenceRequest:
      type: object
      required:
        - topic
        - statement
      properties:
        topic:
          type: string
          description: What the habit is about, e.g. 長跑日 or 重訓頻率. Restating the same topic replaces the habit on record for it.
        statement:
          type: string
          description: The habit in the athlete's own words.
    TrainingPreferenceResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed]
        api_version:
          type: string
        generated_at:
          type: string
        athlete_evidence_version:
          type: integer
        preference:
          type: object
          additionalProperties: true
          description: The stored preference, including when it was recorded. Read it back to the athlete rather than restating what you sent.
        replaced:
          type: [object, "null"]
          additionalProperties: true
          description: The preference this one displaced, when restating the same topic replaced an earlier statement. Null when it replaced nothing.
        training_preferences:
          type: array
          description: Every training preference now on record for this athlete.
          items:
            type: object
            additionalProperties: true
      required:
        - status
        - api_version
        - generated_at
        - athlete_evidence_version
        - preference
        - replaced
        - training_preferences
    StrengthReportRequest:
      type: object
      required:
        - exercise
        - sets
      properties:
        timezone:
          type: string
          description: Overrides the athlete's stored timezone for this call only. It decides what counts as a future date; omit it to use their stored one.
        date:
          type: string
          description: The day the athlete performed this, as an ISO date. Optional; defaults to today in the athlete's own timezone. May not be in their future.
        exercise:
          type: string
          description: The movement as the athlete named it, e.g. bench press.
        category:
          type: string
          description: Optional metadata. Send only when the athlete volunteered it or the plan already names it; never ask the athlete which body part a movement trains.
        sets:
          type: array
          minItems: 1
          description: One entry per set, exactly as reported. Omit a measurement the athlete did not give rather than estimating it.
          items:
            type: object
            properties:
              set:
                type: integer
                minimum: 1
                description: Position of this set within the exercise. Optional; defaults to this set's position in the list.
              weight_kg:
                type: [number, "null"]
              assist_kg:
                type: [number, "null"]
                description: Assistance load, for assisted pull-ups and similar.
              reps:
                type: [integer, "null"]
              rpe:
                type: [number, "null"]
        notes:
          type: array
          items:
            type: string
          description: What the athlete said about the session, in their words, e.g. that the last set was cut short.
    BodyMeasurementRequest:
      type: object
      description: At least one of weight_kg and body_fat_pct is required. Send only what the athlete stated; never convert, estimate, or carry a figure over from another day.
      properties:
        timezone:
          type: string
          description: Overrides the athlete's stored timezone for this call only. It decides what counts as a future date; omit it to use their stored one.
        date:
          type: string
          description: The day this was measured, as an ISO date. Optional; defaults to today in the athlete's own timezone. May not be in their future.
        weight_kg:
          type: [number, "null"]
          description: Body weight in kilograms, as stated. A figure outside 20-400 is refused rather than stored.
        body_fat_pct:
          type: [number, "null"]
          description: Body fat as a percentage, as stated. A figure outside 1-75 is refused rather than stored.
    BodyMeasurementResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed]
        api_version:
          type: string
        generated_at:
          type: string
        measurement_id:
          type: string
          description: Derived from the record's own content, so the same measurement always has the same id.
        idempotent_replay:
          type: boolean
          description: True when this exact measurement was already stored; nothing changed.
        replaced:
          type: [object, "null"]
          additionalProperties: true
          description: The record this one displaced, when restating the same day replaced an earlier reading. Null when it replaced nothing.
        measurement:
          type: object
          additionalProperties: true
          description: The stored measurement, including when it was recorded. Read it back to the athlete rather than restating what you sent.
        measurement_count:
          type: integer
          description: How many days of measurements this athlete now has on record.
      required:
        - status
        - api_version
        - generated_at
        - measurement_id
        - idempotent_replay
        - replaced
        - measurement
        - measurement_count
    ActivitySummaryRequest:
      type: object
      required:
        - sport
        - duration_minutes
      properties:
        timezone:
          type: string
          description: Overrides the athlete's stored timezone for this call only. It decides what counts as a future date; omit it to use their stored one.
        date:
          type: string
          description: The day the athlete trained, as an ISO date. Optional; defaults to today in the athlete's own timezone. May not be in their future.
        sport:
          type: string
          enum: [running, strength, mobility, recovery, cycling, swimming, hiking, rowing]
          description: What they trained. Rest is not a session to report.
        duration_minutes:
          type: integer
          minimum: 1
          description: How long it ran, in whole minutes, as they stated it.
        distance_km:
          type: [number, "null"]
          description: Distance covered, when the athlete gave one. Never derive it from duration.
        subjective_feel:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: How it felt, 1 (worst) to 5 (best) -- the same scale recorded activities carry. Send only when the athlete rated it.
        note:
          type: [string, "null"]
          description: Anything else they said about it, in their own words.
    ActivitySummaryResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed]
        api_version:
          type: string
        generated_at:
          type: string
        summary_id:
          type: string
          description: Derived from the summary's own content, so the same summary always has the same id.
        idempotent_replay:
          type: boolean
          description: True when this exact summary was already stored; nothing changed.
        replaced:
          type: [object, "null"]
          additionalProperties: true
          description: The summary this one displaced, when restating the same sport and day replaced an earlier one. Null when it replaced nothing.
        replaced_note:
          type: [string, "null"]
          description: Present only when something was displaced. Says that one summary per sport per day is held, so a second distinct session of that sport has to be combined into one summary rather than added.
        activity:
          type: object
          additionalProperties: true
          description: The stored summary, including when it was recorded. Read it back to the athlete rather than restating what you sent.
        activity_count:
          type: integer
          description: How many reported sessions this athlete now has on record.
      required:
        - status
        - api_version
        - generated_at
        - summary_id
        - idempotent_replay
        - replaced
        - activity
        - activity_count
    ImportHistoryRequest:
      type: object
      required:
        - format
      properties:
        format:
          type: string
          enum: [csv, apple_health_xml, fit, records]
          description: "What content holds. csv for a spreadsheet export, apple_health_xml for Apple's export.xml or any fragment of it, fit for one base64-encoded .fit file, records when you are supplying rows yourself."
        content:
          type: string
          description: "The file's own text, verbatim, for every format except records. One request holds about 1 MB, but your own context is the tighter limit -- the text has to pass through it. Send a long history in parts, by year; each part is deduped against what the earlier ones wrote, so parts may overlap. An Apple Health export is far past any of that whole: pass only the <Workout> and body-mass <Record> elements, which read identically to the file."
        records:
          type: array
          description: "Sessions you read out of a source that cannot be sent as text, such as a screenshot or a PDF. State only what the source actually says; never fill a distance or a duration you inferred."
          items:
            type: object
            required:
              - date
              - sport
              - duration_minutes
            properties:
              date:
                type: string
              sport:
                type: string
              duration_minutes:
                type: integer
                minimum: 1
              distance_km:
                type: [number, "null"]
              started_at:
                type: [string, "null"]
              external_id:
                type: [string, "null"]
              note:
                type: [string, "null"]
        column_mapping:
          type: object
          additionalProperties: true
          description: "For a CSV whose header this does not recognise: which columns hold the date, sport and duration, plus duration_unit (seconds, minutes, hours or hh:mm:ss) and, if you name a distance column, distance_unit (km, m or mi). Read the units off the file's own header; do not assume them."
        source_name:
          type: [string, "null"]
          description: "What the athlete calls this upload, kept as the provenance the coach reads -- for example Garmin Connect 2019-2026."
        resolutions:
          type: array
          description: Answers to a previous call's needs_confirmation, sent with that same payload again.
          items:
            type: object
            required:
              - conflict_id
              - resolution
            properties:
              conflict_id:
                type: string
              resolution:
                type: string
                enum: [same_session, separate_session]
                description: "same_session when the athlete says the upload describes a session already on record; separate_session when it is another session that day."
        timezone:
          type: string
          description: Overrides the athlete's stored timezone for this call only, e.g. while they are travelling. Omit it otherwise; recordAthleteProfile is what sets the one every call uses.
    ImportHistoryResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed]
        api_version:
          type: string
        generated_at:
          type: string
        import_id:
          type: string
          description: "This upload's own identity, derived from the payload, so the same file sent twice carries the same id."
        format:
          type: string
        recognised_as:
          type: [string, "null"]
          description: "Which known export the header was recognised as, or null when a column_mapping read it."
        already_imported:
          type: boolean
          description: True when this exact payload was imported before and nothing was written again.
        counts:
          type: object
          additionalProperties: true
          description: Exact totals for everything below, including the rows the lists do not show.
        added:
          type: object
          additionalProperties: true
          description: "Sessions newly on record. items is the readable sample, not_shown how many more there were."
        merged:
          type: object
          additionalProperties: true
          description: "Sessions a record already described, left exactly as they stand -- the upload's own reference is written onto them so a re-import recognises them."
        skipped:
          type: object
          additionalProperties: true
          description: Sessions this product already held under the same identity.
        needs_confirmation:
          type: object
          additionalProperties: true
          description: "The only part that requires action. Each entry states what the file said, what is on record, and the question; nothing was written for these rows. Answer by re-sending the identical payload with resolutions."
        measurements_added:
          type: object
          additionalProperties: true
          description: "Body measurements read out of the upload, one per day."
        measurements_skipped:
          type: object
          additionalProperties: true
          description: "Days the athlete had already stated a measurement for; an export is not a newer statement than something they said, so it was left alone."
        unreadable:
          type: object
          additionalProperties: true
          description: "Rows this could not read, each with its row number and the reason. Named rather than counted, so the athlete can see which session is missing."
        note:
          type: string
          description: One sentence naming what happened.
      required:
        - status
        - api_version
        - generated_at
        - import_id
        - format
        - recognised_as
        - already_imported
        - counts
        - added
        - merged
        - skipped
        - needs_confirmation
        - measurements_added
        - measurements_skipped
        - unreadable
        - note
    RetractRecordRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum: [strength_execution, body_measurement, activity_summary, long_term_goal, training_preference]
          description: Which stored record to take back.
        exercise:
          type: string
          description: The movement exactly as recorded. Required when kind is strength_execution.
        sport:
          type: string
          enum: [running, strength, mobility, recovery, cycling, swimming, hiking, rowing]
          description: The sport exactly as recorded. Required when kind is activity_summary.
        metric:
          type: string
          description: The goal exactly as recorded. Required when kind is long_term_goal, which is keyed by name and carries no date.
        topic:
          type: string
          description: The habit exactly as recorded. Required when kind is training_preference, which is keyed by name and carries no date.
        date:
          type: string
          description: The day the record was made against, as an ISO date. Optional; defaults to today in the athlete's own timezone. May not be in their future.
        started_at:
          type: [string, "null"]
          description: "Which session, when a day holds more than one of that sport -- an uploaded history can. Send it only after a previous call came back with candidates, copying the started_at of the one the athlete meant."
        timezone:
          type: string
          description: Overrides the athlete's stored timezone for this call only, e.g. while they are travelling. Omit it otherwise; recordAthleteProfile is what sets the one every call uses.
    RetractRecordResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed]
        api_version:
          type: string
        generated_at:
          type: string
        retracted:
          type: boolean
          description: True when the retraction was carried out, including the harmless case where nothing matched. False only when the sport and date named more than one session and candidates says which; nothing was removed then.
        removed:
          type: [object, "null"]
          additionalProperties: true
          description: The full record that was removed, or null when nothing matched.
        record_count:
          type: integer
          description: How many records of this kind this athlete now has on record.
        on_record_that_day:
          type: [array, "null"]
          items:
            type: string
          description: Present when a strength_execution or activity_summary retraction found nothing, naming what is on record for that day instead so a caller can retry with the right name. Always null for body_measurement, which is keyed by date alone and has no second name to have gotten wrong.
        candidates:
          type: array
          items:
            type: object
            additionalProperties: true
          description: "Non-empty only when retracted is false, because the sport and date named more than one session -- an uploaded history can hold two runs on one evening, which a conversation never could. Each entry carries the started_at to send back to remove that one. Empty on every other outcome."
        note:
          type: [string, "null"]
          description: Null when a record was removed; a plain sentence when nothing was found, or when more than one session matched and nothing was removed.
      required:
        - status
        - api_version
        - generated_at
        - retracted
        - removed
        - record_count
        - on_record_that_day
        - candidates
        - note
    PrescribedStrengthRequest:
      type: object
      required:
        - session_id
      properties:
        timezone:
          type: string
          description: Overrides the athlete's stored timezone for this call only. It decides what counts as a future date; omit it to use their stored one.
        session_id:
          type: string
          description: The strength session in the current week the athlete is confirming, from startCoachSession's plan_state. Its scheduled date is the day the sets are recorded against; a session still in the athlete's future is refused.
        deviations:
          type: array
          description: One entry per set that differed from the prescription. Send nothing here when the athlete said it went as planned. Each entry names the movement and the set, plus only the measurements that differed -- everything else is recorded as prescribed.
          items:
            type: object
            required:
              - exercise
              - set
            properties:
              exercise:
                type: string
                description: The movement as the session prescribes it. Must be one this session actually holds.
              set:
                type: integer
                minimum: 1
                description: Which set of that movement differed, counting from 1. Must be within the number of sets prescribed.
              reps:
                type: [integer, "null"]
                description: Reps actually completed, when they differed, e.g. 3 for "the last set was only 3".
              weight_kg:
                type: [number, "null"]
              assist_kg:
                type: [number, "null"]
              rpe:
                type: [number, "null"]
    PrescribedStrengthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed]
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: string
        plan_version:
          type: integer
        date:
          type: string
          description: The session's own scheduled date, which the sets were recorded against.
        session_id:
          type: string
        source:
          type: string
          enum: [prescribed_confirmed]
          description: What these records are. A confirmed prescription, not a measurement, and distinct from a set-by-set report -- the coach reads this to know which it is holding.
        movements:
          type: array
          description: One entry per prescribed movement, each naming what was stored and what it displaced.
          items:
            type: object
            additionalProperties: true
        idempotent_replay:
          type: boolean
          description: True when every movement was already stored exactly like this; nothing changed.
        report_count:
          type: integer
          description: How many strength records this athlete now has on record.
      required:
        - status
        - api_version
        - generated_at
        - plan_id
        - plan_version
        - date
        - session_id
        - source
        - movements
        - idempotent_replay
        - report_count
    StrengthReportResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed]
        api_version:
          type: string
        generated_at:
          type: string
        report_id:
          type: string
          description: Derived from the report's own content, so the same report always has the same id.
        idempotent_replay:
          type: boolean
          description: True when this exact report was already stored; nothing was added.
        replaced:
          type: [object, "null"]
          additionalProperties: true
          description: The record this report displaced, when re-reporting the same movement on the same day replaced an earlier one. Null when it replaced nothing.
        report:
          type: object
          additionalProperties: true
          description: The stored report, including when it was recorded.
        report_count:
          type: integer
          description: How many reports this athlete now has on record.
      required:
        - status
        - api_version
        - generated_at
        - report_id
        - idempotent_replay
        - replaced
        - report
        - report_count
    InitializationPrepareRequest:
      type: object
      required:
        - initialization_request
      properties:
        initialization_request:
          $ref: "#/components/schemas/CoachInitializationRequest"
    InitializationPrepareResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: string
        plan_version:
          type: integer
        proposal:
          type: string
          description: Binds this exact first plan to this athlete until expires_at. Pass back unchanged to initializeCoachPlan.
        expires_at:
          type: string
          description: After this instant the proposal is refused; re-run prepareCoachInitialization to get a fresh one.
        confirmation_required:
          type: boolean
        preview:
          $ref: "#/components/schemas/InitialPlanPreview"
        validation:
          $ref: "#/components/schemas/ValidationSummary"
        warnings:
          type: array
          items:
            type: string
        unknowns:
          type: array
          items:
            type: string
          description: What this plan does not stand on, including every baseline the athlete has not measured. Say these out loud with the preview.
        athlete_profile:
          type: [object, "null"]
          additionalProperties: true
          description: The stored timezone and language this preview was built on, or null when the athlete has stated neither. Show it beside unknowns - every date in the first week was computed in that timezone, so a wrong or unstated one is the athlete's chance to correct before the plan exists.
    InitialPlanPreview:
      type: object
      description: The exact first plan, in its own values, plus the facts it was built from. Show these values to the athlete; never restate the plan from memory.
      properties:
        plan_id:
          type: string
        plan_version:
          type: integer
        goal:
          type: object
          properties:
            outcome:
              type: string
            measurement_protocol:
              type: string
        cycle:
          type: object
          properties:
            start:
              type: string
            end:
              type: string
            primary_adaptation:
              type: string
            maintenance_adaptation:
              type: [string, "null"]
        week:
          type: object
          properties:
            start:
              type: string
            intent:
              type: string
        sessions:
          type: array
          items:
            type: object
            properties:
              session_id:
                type: string
              scheduled_date:
                type: string
              sport:
                type: string
              adaptation:
                type: string
              cost:
                type: string
              priority:
                type: string
              planned_minutes:
                type: [integer, "null"]
              prescription:
                type: string
                description: The athlete-readable rendering of this session's plan, generated by the gateway. Show it; never restate it.
              time_window:
                type: [string, "null"]
              plan:
                $ref: "#/components/schemas/SessionPlan"
        weekly_planned_minutes:
          type: [integer, "null"]
        hard_sessions:
          type: integer
        athlete_baseline:
          type: object
          additionalProperties: true
          description: The baselines this plan stands on. Anything the athlete has not measured is null here, and named in unknowns.
        availability:
          type: [object, "null"]
          description: The training days and equipment the plan was built from, echoed back so the athlete can correct a misheard fact.
          properties:
            days:
              type: array
              items:
                type: string
            equipment:
              type: array
              items:
                type: string
        summary:
          type: string
        evidence:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              observation:
                type: string
        unknowns:
          type: array
          items:
            type: string
    InitializationApplyRequest:
      type: object
      required:
        - initialization_request
        - proposal
        - confirmed
      properties:
        initialization_request:
          $ref: "#/components/schemas/CoachInitializationRequest"
        proposal:
          type: string
          description: The proposal returned by prepareCoachInitialization, unchanged.
        confirmed:
          type: boolean
          description: Must be true. Set only after the athlete has confirmed the preview.
    InitializationApplyResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: string
        plan_version:
          type: integer
        idempotent_replay:
          type: boolean
          description: True when this exact initialization already ran and this request replayed that prior success.
        validation:
          $ref: "#/components/schemas/ValidationSummary"
    CoachInitializationRequest:
      type: object
      description: >-
        The first plan, carrying coaching judgment and athlete facts only. The gateway
        builds the PlanState from it and owns its schema, id, version, status, session
        ids, cycle end date, week start and delivery bookkeeping. Never send a PlanState.
      required:
        - goal
        - cycle
        - week_intent
        - sessions
        - summary
        - evidence
      properties:
        goal:
          type: object
          required:
            - outcome
            - measurement_protocol
          properties:
            outcome:
              type: string
              description: What the athlete is training for, in their own words.
            measurement_protocol:
              type: string
              description: How they will tell at day 28 whether it worked. Prose here; the runnable form needs a session that exists, so declare it at a later change once the reference session is on the plan.
        cycle:
          type: object
          description: Where the 28 days point. The end date is derived from start.
          required:
            - start
            - primary_adaptation
            - planned_evidence
            - adjust_conditions
            - stop_conditions
            - outlook
          properties:
            start:
              type: string
              description: ISO date the block starts. The first week starts with it.
            primary_adaptation:
              type: string
              enum: [aerobic_base, threshold, vo2, strength, hypertrophy, power, recovery]
            maintenance_adaptation:
              type: [string, "null"]
              enum: [aerobic_base, threshold, vo2, strength, hypertrophy, power, recovery, null]
            planned_evidence:
              type: array
              minItems: 1
              items:
                type: string
              description: What the block should produce if it is working.
            adjust_conditions:
              type: array
              minItems: 1
              items:
                type: string
            stop_conditions:
              type: array
              minItems: 1
              items:
                type: string
            outlook:
              type: array
              minItems: 3
              maxItems: 3
              description: The three weeks after the first one, so the athlete sees the whole 28 days in the preview they confirm rather than only week one.
              items:
                type: object
                description: One outlined week. It carries no session ids and no prescriptions, so nothing here can be delivered to a calendar or reconciled -- a week becomes precise when a review makes it the current week.
                required:
                  - week_start
                  - intent
                  - key_sessions
                  - relation_to_primary
                properties:
                  week_start:
                    type: string
                    description: ISO date, exactly seven days after the week before it.
                  intent:
                    type: string
                    description: What this week is for.
                  key_sessions:
                    type: array
                    minItems: 1
                    items:
                      type: string
                    description: "The sessions that give the week its shape, as the athlete would recognise them: what kind, and roughly how much. State magnitude, not a pace, heart rate or load no anchor supports yet."
                  relation_to_primary:
                    type: string
                    description: How this week moves the primary adaptation -- build, hold, recover, or measure.
        week_intent:
          type: string
          description: What the first week is for.
        availability:
          type: object
          description: When the athlete can train and with what. Echoed in the preview for them to correct; the sessions are where it takes effect.
          properties:
            days:
              type: array
              items:
                type: string
            equipment:
              type: array
              items:
                type: string
        baselines:
          type: object
          description: >-
            Only what the athlete actually supports. Leave out, or send null, anything
            they have not measured -- a missing anchor stays unknown and is reported back
            in unknowns. Never estimate one to fill the field, and never prescribe an
            exact pace, BPM or kg that no baseline here supports.
          properties:
            threshold_pace_sec_per_km:
              type: [integer, "null"]
            max_hr:
              type: [integer, "null"]
            easy_hr_ceiling:
              type: [integer, "null"]
              description: Anchors hr_ceiling workout targets alongside any measured max_hr; the higher of whichever bounds are stated is the one used.
            longest_recent_run_km:
              type: [number, "null"]
            weekly_volume_km_4wk_avg:
              type: [number, "null"]
            max_session_minutes:
              type: [integer, "null"]
            strength_loads:
              type: array
              description: One entry per lift the athlete has a real figure for. An assisted lift records assist_kg and leaves load_kg null.
              items:
                type: object
                required:
                  - exercise
                properties:
                  exercise:
                    type: string
                  load_kg:
                    type: [number, "null"]
                  assist_kg:
                    type: [number, "null"]
                  scheme:
                    type: [string, "null"]
                  display_name:
                    type: string
                    description: How the athlete says this lift, when a plan names it in their wording.
        sessions:
          type: array
          minItems: 1
          description: The first week's sessions. There is no default week; every session is one you decided on.
          items:
            $ref: "#/components/schemas/InitialSession"
        summary:
          type: string
          description: One line saying what this plan is and why, in the athlete's own language.
        evidence:
          type: array
          minItems: 1
          description: What the athlete actually told you, and where it came from.
          items:
            type: object
            required:
              - field
              - observation
            properties:
              field:
                type: string
              observation:
                type: string
        unknowns:
          type: array
          items:
            type: string
          description: What you could not establish. The gateway adds every unmeasured baseline to these.
    InitialSession:
      type: object
      description: One session of the first week. The gateway names it and derives whether it is hard and whether it can be delivered.
      required:
        - sport
        - scheduled_date
        - purpose
        - adaptation
        - body_stress
        - cost
        - priority
        - planned_minutes
        - plan
        - fallback
      properties:
        sport:
          type: string
          enum: [running, strength, mobility, recovery, rest, cycling, swimming, hiking, rowing]
        scheduled_date:
          type: string
          description: ISO date, inside the first week (cycle start through cycle start plus six days).
        purpose:
          type: string
          description: What the session is for, and the title a strength day reaches the athlete's watch under. Intent only, never a prescription - a number wearing a unit (4:30/km, 5km, 80kg, 150bpm, 85%) is refused and the error names it. A digit on its own is fine. Every number the athlete executes belongs in plan.
        adaptation:
          type: string
          enum: [aerobic_base, threshold, vo2, strength, hypertrophy, power, recovery]
        body_stress:
          type: string
          enum: [lower, upper, full, systemic]
        cost:
          type: string
          enum: [easy, moderate, hard]
        priority:
          type: string
          enum: [anchor, flexible, optional]
        planned_minutes:
          type: integer
        plan:
          $ref: "#/components/schemas/SessionPlan"
        time_window:
          type: [string, "null"]
          description: Optional, for example morning or evening.
        fallback:
          type: object
          required:
            - action
            - description
          properties:
            action:
              type: string
              enum: [reduce, move, replace, rest]
            description:
              type: string
    SessionPlan:
      description: >-
        What the session prescribes, structured, classified by how it is executed rather
        than by which sport it is: time_axis for work laid out along time or distance
        with an intensity target, movement_list for work laid out as movements with sets
        and loads, unstructured for a session that declares no numbers at all (mobility,
        recovery, rest — and a strength session whose athlete declined to enumerate
        movements, which adopts with a warning; a run may never be unstructured). No
        request in this API accepts a prescription: the athlete-readable sentence is
        rendered from this object and returned in the preview, so it cannot say
        something this object does not.
      oneOf:
        - $ref: "#/components/schemas/TimeAxisPlan"
        - $ref: "#/components/schemas/MovementListPlan"
        - $ref: "#/components/schemas/UnstructuredPlan"
    TimeAxisPlan:
      type: object
      description: What the watch executes for a running session. One target kind per session -- never mix pace and heart rate.
      required:
        - kind
        - name
        - steps
      properties:
        kind:
          type: string
          enum: [time_axis]
        name:
          type: string
          description: At most 80 characters; the title the athlete sees on the watch.
        steps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WorkoutBlock"
    MovementListPlan:
      type: object
      description: What the athlete lifts, so the plan's numbers can be compared with what came back. It never reaches the watch as structure -- a movement list publishes as a titled calendar entry.
      required:
        - kind
        - movements
      properties:
        kind:
          type: string
          enum: [movement_list]
        movements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StrengthMovement"
    UnstructuredPlan:
      type: object
      description: A session that declares no numbers -- mobility, recovery, rest. It carries no field but its own kind, so nothing can ride along inside it.
      required:
        - kind
      properties:
        kind:
          type: string
          enum: [unstructured]
    StrengthMovement:
      type: object
      description: One planned movement. load_basis says why a load is what it is, so an absent kg figure is never a guess.
      required:
        - exercise
        - display_name
        - sets
        - reps
        - load_kg
        - assist_kg
        - load_basis
      properties:
        exercise:
          type: string
          description: The canonical key this lift's baseline uses, so the two compare field to field. Never shown to the athlete.
        display_name:
          type: string
          description: The movement as the athlete reads it, in their own language. This is the name that reaches their screen and the watch's calendar entry, so give it even when it matches the key.
        sets:
          type: integer
          minimum: 1
        reps:
          type: [integer, "null"]
          description: Null for a set taken to failure.
        load_kg:
          type: [number, "null"]
        assist_kg:
          type: [number, "null"]
        load_basis:
          type: string
          enum: [measured_baseline, bodyweight, pending_confirmation]
          description: measured_baseline needs a load_kg or assist_kg figure matching a baseline strength_load; bodyweight and pending_confirmation must leave both null.
    WorkoutBlock:
      type: object
      description: One work step, or one repeat wrapping work steps.
      required:
        - kind
      properties:
        kind:
          type: string
          enum: [work, repeat]
        name:
          type: string
          description: Work steps only.
        duration:
          $ref: "#/components/schemas/WorkoutDuration"
        target:
          $ref: "#/components/schemas/WorkoutTarget"
        repetitions:
          type: integer
          description: Repeat blocks only.
        steps:
          type: array
          description: Repeat blocks only; work steps, never another repeat. A heart-rate ceiling cannot be used inside a repeat.
          items:
            type: object
            required:
              - kind
              - name
              - duration
              - target
            properties:
              kind:
                type: string
                enum: [work]
              name:
                type: string
              duration:
                $ref: "#/components/schemas/WorkoutDuration"
              target:
                $ref: "#/components/schemas/WorkoutTarget"
    WorkoutDuration:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum: [time, distance]
        seconds:
          type: integer
          description: Required when kind is time.
        meters:
          type: integer
          description: Required when kind is distance.
    WorkoutTarget:
      type: object
      description: open leaves intensity to the athlete; pace needs a measured threshold pace; hr_ceiling is an upper bound only and needs a measured max heart rate.
      required:
        - kind
      properties:
        kind:
          type: string
          enum: [open, pace, hr_ceiling]
        unit:
          type: string
          enum: [sec_per_km, bpm]
        low_seconds_per_km:
          type: integer
        high_seconds_per_km:
          type: integer
        ceiling_bpm:
          type: integer
    SessionChange:
      type: object
      description: >-
        One operation on one session; each session may appear at most once. keep, move,
        reduce and replace name an existing session_id; add creates a session and the
        gateway names it. There is no remove: to drop a session, replace it with a rest
        or recovery session so the decision stays visible in the plan's history. `plan`
        is required for replace and add, and required on a reduce whose session is laid
        out along time -- shortening such a session without saying what it now holds
        would leave what the watch executes describing the session it used to be. On any
        other reduce `plan` is optional and the stored one stands, so restate it whenever
        the reduce changes what the session prescribes -- fewer sets, a different lift --
        and leave it out when only the duration moves.
      required:
        - operation
      properties:
        operation:
          type: string
          enum: [keep, move, reduce, replace, add]
        session_id:
          type: string
          description: Required for keep, move, reduce and replace. Never sent for add.
        scheduled_date:
          type: string
          description: ISO date. Required for move and add; optional for replace.
        planned_minutes:
          type: integer
          description: Required for reduce (must be below the current value), replace and add.
        plan:
          $ref: "#/components/schemas/SessionPlan"
        purpose:
          type: string
          description: Why this session exists, and the title a strength day reaches the athlete's watch under. Required for replace and add; optional for reduce and keep. On keep this is the only field you may send -- it rewords the label without moving the schedule, structure, or match_status, for example fixing a watch title that reads unclear. Intent only, never a prescription - a number wearing a unit (4:30/km, 5km, 80kg, 150bpm, 85%) is refused and the error names it. A digit on its own is fine. Every number the athlete executes belongs in plan.
        measures:
          type: [string, "null"]
          description: On replace and add only. The session_id this session repeats for the cycle's measurement, matching goal.measurement.reference_session_id -- send it when you schedule the comparison in the measurement week. It makes an ordinary session the measurement point; there is no measurement session type, and nothing about delivery changes. Null on a replace clears it.
        sport:
          type: string
          enum: [running, strength, mobility, recovery, rest, cycling, swimming, hiking, rowing]
          description: Required for add; for replace it defaults to the session's current sport.
        adaptation:
          type: string
          enum: [aerobic_base, threshold, vo2, strength, hypertrophy, power, recovery]
          description: Required for replace and add.
        cost:
          type: string
          enum: [easy, moderate, hard]
          description: Required for replace and add.
        body_stress:
          type: string
          enum: [lower, upper, full, systemic]
          description: Required for add; kept as-is for replace unless given.
        priority:
          type: string
          enum: [anchor, flexible, optional]
          description: Required for add; kept as-is for replace unless given.
        time_window:
          type: [string, "null"]
          description: Optional, for example morning or evening.
        fallback:
          type: object
          description: What to do when the session cannot be done as written. Required for add.
          required:
            - action
            - description
          properties:
            action:
              type: string
              enum: [reduce, move, replace, rest]
            description:
              type: string
    CoachChangeRequest:
      type: object
      description: >-
        One small coaching change, carrying coaching judgment only. The gateway projects
        it onto the current PlanState: it copies every field you did not change, and it
        owns the resulting PlanState and DecisionEvent, their versions, ids, hashes,
        timestamps, and delivery bookkeeping. Never send a PlanState or a DecisionEvent.
      required:
        - summary
        - reason_codes
        - evidence
        - goal_effect
        - next_review_condition
      properties:
        summary:
          type: string
          description: One line saying what changes and why, in the athlete's own language.
        reason_codes:
          type: array
          minItems: 1
          description: Why this change is being made; at least one, no repeats.
          items:
            type: string
            enum:
              - actual_load_above_plan
              - actual_load_below_plan
              - multi_signal_recovery_down
              - recovery_signal_mixed
              - lower_body_stress_conflict
              - quality_session_conflict
              - schedule_or_equipment_changed
              - goal_priority_changed
              - data_stale_or_missing
              - pain_or_illness_flag
              - plan_kept_no_material_change
        evidence:
          type: array
          minItems: 1
          description: What you actually read, and where. Never cite evidence the session response did not contain.
          items:
            type: object
            required:
              - field
              - observation
            properties:
              field:
                type: string
                description: Where you read it, for example recovery_trends.hrv or recent_actuals.
              observation:
                type: string
                description: What it said.
        goal_effect:
          type: object
          required:
            - week
            - cycle
          properties:
            week:
              type: string
              description: What this does to the current week.
            cycle:
              type: string
              description: What this does to the 28-day direction.
        next_review_condition:
          type: string
          description: What should trigger the next look at this plan.
        unknowns:
          type: array
          items:
            type: string
          description: What you could not establish. The gateway adds the context's own unknowns to these.
        sessions:
          type: array
          description: The session changes. Omit or leave empty when only the goal, cycle or week text changes.
          items:
            $ref: "#/components/schemas/SessionChange"
        goal:
          type: object
          description: Send only when the 28-day outcome itself changes; the two prose fields are then required. It replaces the goal whole, so a measurement that still holds has to be restated with it.
          required:
            - outcome
            - measurement_protocol
          properties:
            outcome:
              type: string
            measurement_protocol:
              type: string
            measurement:
              type: object
              description: "The runnable half of the protocol: which ordinary session this cycle measures against, which of its weeks repeats that session, and what to hold constant. Optional -- a protocol in prose alone is still a protocol, and a review then says the measurement is owed rather than reading one that was never taken."
              required:
                - reference_session_id
                - measurement_week_start
                - compare
              properties:
                reference_session_id:
                  type: string
                  description: The session_id this cycle measures against -- an ordinary session, usually early in the cycle, whose result is the reading everything is compared to. Not a new kind of session.
                measurement_week_start:
                  type: string
                  description: ISO date of the week that repeats it, and one of this cycle's own weeks. Scheduling that session when the week arrives is your job at the review, not something the athlete is expected to remember.
                compare:
                  type: string
                  description: "What is held constant and what is read: same route and pace, compare average heart rate. State the comparison; the verdict is yours to give at the review, and nothing scores it."
        cycle:
          type: object
          description: Send only the cycle fields that change; everything else is kept.
          properties:
            start:
              type: string
            end:
              type: string
            primary_adaptation:
              type: string
              enum: [aerobic_base, threshold, vo2, strength, hypertrophy, power, recovery]
            maintenance_adaptation:
              type: [string, "null"]
              enum: [aerobic_base, threshold, vo2, strength, hypertrophy, power, recovery, null]
            planned_evidence:
              type: array
              items:
                type: string
            adjust_conditions:
              type: array
              items:
                type: string
            stop_conditions:
              type: array
              items:
                type: string
            outlook:
              type: array
              maxItems: 3
              description: The weeks of this cycle after the new current week, replacing the previous outlook whole. Send it whenever the week rolls or the direction moves; the week just made precise leaves it.
              items:
                type: object
                description: One outlined week. It carries no session ids and no prescriptions, so nothing here can be delivered to a calendar or reconciled -- a week becomes precise when a review makes it the current week.
                required:
                  - week_start
                  - intent
                  - key_sessions
                  - relation_to_primary
                properties:
                  week_start:
                    type: string
                    description: ISO date, exactly seven days after the week before it.
                  intent:
                    type: string
                    description: What this week is for.
                  key_sessions:
                    type: array
                    minItems: 1
                    items:
                      type: string
                    description: "The sessions that give the week its shape, as the athlete would recognise them: what kind, and roughly how much. State magnitude, not a pace, heart rate or load no anchor supports yet."
                  relation_to_primary:
                    type: string
                    description: How this week moves the primary adaptation -- build, hold, recover, or measure.
        athlete_baseline:
          type: object
          description: >-
            Send only the baseline fields the evidence has moved; everything else is
            kept. Values are measured figures, never null -- clearing an anchor is not
            available here. strength_loads updates or adds the movements it names and
            touches no other movement; naming load_kg or assist_kg replaces that pair,
            scheme and display_name are kept unless restated.
          properties:
            threshold_pace_sec_per_km:
              type: integer
            max_hr:
              type: integer
            easy_hr_ceiling:
              type: integer
              description: Anchors hr_ceiling workout targets alongside any measured max_hr; the higher of whichever bounds are stated is the one used.
            max_session_minutes:
              type: integer
            longest_recent_run_km:
              type: number
            weekly_volume_km_4wk_avg:
              type: number
            strength_loads:
              type: array
              minItems: 1
              items:
                type: object
                required:
                  - exercise
                properties:
                  exercise:
                    type: string
                  load_kg:
                    type: number
                  assist_kg:
                    type: number
                  scheme:
                    type: [string, "null"]
                  display_name:
                    type: string
        week:
          type: object
          description: Send only the week fields that change.
          properties:
            start:
              type: string
            intent:
              type: string
    ChangePreviewSession:
      type: object
      properties:
        session_id:
          type: [string, "null"]
        scheduled_date:
          type: [string, "null"]
        sport:
          type: [string, "null"]
        adaptation:
          type: [string, "null"]
        cost:
          type: [string, "null"]
        priority:
          type: [string, "null"]
        planned_minutes:
          type: [integer, "null"]
        prescription:
          type: [string, "null"]
          description: The athlete-readable rendering of this session's plan, generated by the gateway. Show it; never restate it.
        time_window:
          type: [string, "null"]
        match_status:
          type: [string, "null"]
        plan_kind:
          type: [string, "null"]
          enum: [time_axis, movement_list, unstructured, null]
        workout_name:
          type: [string, "null"]
        delivery_state:
          type: [string, "null"]
    ChangePreview:
      type: object
      description: The exact before and after values of everything this change moves. Show these values to the athlete; never restate the change from memory.
      properties:
        material_change:
          type: boolean
          description: False when the projection moves nothing; then there is nothing to confirm.
        base_version:
          type: integer
        resulting_version:
          type: integer
        goal:
          type: [object, "null"]
          description: Present only when the goal changes.
          properties:
            before:
              type: object
              additionalProperties: true
            after:
              type: object
              additionalProperties: true
        cycle:
          type: [object, "null"]
          description: Present only when the 28-day cycle changes.
          properties:
            before:
              type: object
              additionalProperties: true
            after:
              type: object
              additionalProperties: true
        athlete_baseline:
          type: [object, "null"]
          description: Present only when the baseline changes. Show the moved anchor with the change; it is part of what the athlete confirms.
          properties:
            before:
              type: object
              additionalProperties: true
            after:
              type: object
              additionalProperties: true
        week:
          type: [object, "null"]
          description: Present only when the week start or intent changes.
          properties:
            before:
              type: object
              additionalProperties: true
            after:
              type: object
              additionalProperties: true
        sessions:
          type: array
          items:
            type: object
            properties:
              operation:
                type: string
              session_id:
                type: string
              changed_fields:
                type: array
                items:
                  type: string
              before:
                oneOf:
                  - $ref: "#/components/schemas/ChangePreviewSession"
                  - type: "null"
                description: Null when the session is being added.
              after:
                $ref: "#/components/schemas/ChangePreviewSession"
        weekly_planned_minutes:
          type: object
          properties:
            before:
              type: [integer, "null"]
            after:
              type: [integer, "null"]
        hard_sessions:
          type: object
          properties:
            before:
              type: integer
            after:
              type: integer
    DecisionPrepareRequest:
      type: object
      required:
        - plan_id
        - plan_version
        - context
        - change_request
      properties:
        plan_id:
          type: string
          description: The plan_id from startCoachSession.
        plan_version:
          type: integer
          description: The plan_version from startCoachSession.
        context:
          type: object
          additionalProperties: true
          description: The CoachContext returned by startCoachSession. Opaque -- pass back verbatim.
        change_request:
          $ref: "#/components/schemas/CoachChangeRequest"
    DecisionPrepareResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: string
        base_version:
          type: integer
        resulting_version:
          type: [integer, "null"]
        proposal:
          type: string
          description: Binds this athlete, this context, this plan version and the exact projected change, until expires_at. Pass back unchanged to applyCoachDecision.
        expires_at:
          type: string
          description: After this instant the proposal is refused; re-run prepareCoachDecision to get a fresh one.
        confirmation_required:
          type: boolean
          description: False when nothing material moved; do not ask the athlete to confirm a change that is not one.
        preview:
          $ref: "#/components/schemas/ChangePreview"
        validation:
          $ref: "#/components/schemas/ValidationSummary"
        warnings:
          type: array
          items:
            type: string
        unknowns:
          type: array
          items:
            type: string
    DecisionApplyRequest:
      type: object
      required:
        - plan_id
        - plan_version
        - context
        - change_request
        - proposal
      properties:
        plan_id:
          type: string
        plan_version:
          type: integer
        context:
          type: object
          additionalProperties: true
          description: The exact same CoachContext passed to prepareCoachDecision.
        change_request:
          $ref: "#/components/schemas/CoachChangeRequest"
        proposal:
          type: string
          description: The proposal returned by prepareCoachDecision, unchanged.
        confirmed:
          type: boolean
          description: Must be true whenever prepareCoachDecision returned confirmation_required. Set only after the athlete has confirmed the preview.
    DecisionApplyResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: string
        plan_version:
          type: integer
        event_id:
          type: [string, "null"]
        idempotent_replay:
          type: boolean
          description: True when this exact decision was already committed and this request replayed that prior success.
        validation:
          $ref: "#/components/schemas/ValidationSummary"
    DeliveryAttemptClearRequest:
      type: object
      required:
        - attempt_id
        - confirmed
      properties:
        attempt_id:
          type: string
          description: The exact attempt_id from delivery.unresolved_delivery in the most recent startCoachSession. If the store now holds a different reservation the request is refused rather than clearing the wrong one.
        confirmed:
          type: boolean
          description: Must be true. Set only after telling the athlete which sessions are unresolved and hearing that they have checked their Intervals calendar.
    DeliveryAttemptClearResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        cleared:
          type: boolean
          description: False when there was no reservation to release, which is the normal answer to a repeated call. Never an error.
        attempt_id:
          type: [string, "null"]
        abandoned:
          type: array
          description: The operations this product has now stopped tracking. Say them back to the athlete; the Intervals calendar is the only remaining record of whether they landed.
          items:
            type: object
            properties:
              session_id:
                type: string
              operation:
                type: string
              state:
                type: string
              external_id:
                type: [string, "null"]
        detail:
          type: string
    DeliveryPrepareRequest:
      type: object
      required:
        - plan_id
        - plan_version
        - session_ids
      properties:
        plan_id:
          type: string
        plan_version:
          type: integer
        session_ids:
          type: array
          items:
            type: string
          description: session_id values from the current PlanState's week.sessions to prepare for delivery -- or, when withdraw is true, session_id values whose execution.superseded_external_id names an Intervals event the current plan no longer describes.
        withdraw:
          type: boolean
          description: "Defaults to false. True previews removing superseded delivered workouts from Intervals instead of delivering new ones."
    DeliveryPrepareResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: string
        plan_version:
          type: integer
        proposal_id:
          type: string
        proposal_hash:
          type: string
          description: Binds this exact delivery or withdrawal set. Pass back unchanged to applyWorkoutDelivery.
        confirmation_required:
          type: boolean
        preview:
          type: array
          description: Show this whole batch to the athlete once before asking for the one delivery or withdrawal confirmation. A delivery item carries sport/name/plan_prescription/delivered_description/hr_ceiling_resolution/owned_external_id/proposal_hash; a withdrawal item carries only superseded_external_id alongside session_id and scheduled_date.
          items:
            type: object
            properties:
              session_id:
                type: string
              scheduled_date:
                type: string
              sport:
                type: string
              name:
                type: string
              plan_prescription:
                type: [string, "null"]
              delivered_description:
                type: string
              hr_ceiling_resolution:
                type: [object, "null"]
                description: >-
                  Present only when this workout binds a heart-rate ceiling. The plan states the
                  ceiling in bpm; Intervals can only carry it as a percentage of the account's Run
                  threshold HR, so the delivered text reads e.g. `50-86% LTHR`. Show
                  resolved_ceiling_bpm alongside it so the athlete confirms a heart rate rather than
                  a percentage. resolved_ceiling_bpm is never above plan_ceiling_bpm.
                properties:
                  run_threshold_hr:
                    type: integer
                  percent_lthr_low:
                    type: integer
                  percent_lthr_high:
                    type: integer
                  resolved_ceiling_bpm:
                    type: integer
                  plan_ceiling_bpm:
                    type: integer
              owned_external_id:
                type: string
              proposal_hash:
                type: string
              superseded_external_id:
                type: string
        settings_changes:
          type: array
          description: Show these alongside the workout preview before asking for the one confirmation. Empty unless a pace workout would lose its target because Intervals has no Run threshold pace; never replaces an existing value.
          items:
            type: object
            properties:
              sport:
                type: string
              field:
                type: string
              current:
                type: [number, "null"]
              proposed:
                type: number
                description: Intervals' metres-per-second representation.
              proposed_seconds_per_km:
                type: integer
                description: The same measured PlanState baseline in athlete-facing units.
              source:
                type: string
              reason:
                type: string
        delivery_set:
          type: object
          additionalProperties: true
          description: The full proposal set. Its direction -- deliver or withdraw -- is part of what proposal_hash binds, so applyWorkoutDelivery reads it from here. Opaque -- pass back verbatim to applyWorkoutDelivery unchanged.
    DeliveryApplyRequest:
      type: object
      required:
        - delivery_set
        - proposal_hash
        - confirmed
      properties:
        delivery_set:
          type: object
          additionalProperties: true
          description: The exact delivery_set returned by prepareWorkoutDelivery, unchanged.
        proposal_hash:
          type: string
          description: The exact proposal_hash returned by prepareWorkoutDelivery, unchanged.
        confirmed:
          type: boolean
          description: Must be true. Set only after the athlete has confirmed the preview.
        timezone:
          type: string
          description: Overrides the athlete's stored timezone for this call only. Only affects the withdraw direction, where it decides which days count as already past and are therefore never removed; ignored when applying a delivery. Omit it to use their stored one.
    DeliveryApplyResponse:
      type: object
      properties:
        status:
          type: string
          description: For a delivery, passed when every session reached intervals_accepted and partial when some remain under unresolved. For a withdrawal, passed when every confirmed event is verified gone and partial when some remain under unresolved.
        api_version:
          type: string
        generated_at:
          type: string
        delivery_state:
          type: string
          description: Present on the delivery direction only. The furthest delivery evidence observed for this publish. Never implies Garmin Connect or the watch received anything.
        max_delivery_state:
          type: string
          description: Present on the delivery direction only. The furthest state this product can ever observe, so a caller can see that intervals_accepted is not a claim about the watch.
        plan_id:
          type: string
        plan_version:
          type: integer
        receipt_id:
          type: string
        proposal_hash:
          type: string
        settings_changes:
          type: array
          description: Present on the delivery direction. Each item says whether the confirmed Run threshold pace was updated or was already current on a retry, and that its read-back was verified.
          items:
            type: object
            properties:
              sport:
                type: string
              field:
                type: string
              value:
                type: number
              seconds_per_km:
                type: integer
              operation:
                type: string
                enum: [updated, already_current]
              verified:
                type: boolean
        delivered:
          type: array
          description: Present on the delivery direction only.
          items:
            type: object
            properties:
              session_id:
                type: string
              external_id:
                type: string
              owned_external_id:
                type: string
              operation:
                type: string
              delivery_state:
                type: string
        withdrawn:
          type: array
          description: Present on the withdraw direction only.
          items:
            type: object
            properties:
              session_id:
                type: string
              external_id:
                type: string
        unresolved:
          type: array
          description: Sessions of this set Intervals does not yet confirm -- not holding an approved delivery, or not verified gone, depending on direction. Empty on a clean apply. Retry the same delivery_set and proposal_hash to finish them; a newly prepared set is refused until then.
          items:
            type: object
            properties:
              session_id:
                type: string
              scheduled_date:
                type: string
              error:
                type: string
        attempt_open:
          type: boolean
          description: True when Intervals may hold an effect of this apply that the plan does not record, for either direction. No plan change is possible while it is true; retrying the same delivery_set is what resolves it.
        state_update:
          type: object
          description: Present on the delivery direction only.
          properties:
            event_id:
              type: [string, "null"]
            idempotent_replay:
              type: boolean
            session_ids:
              type: array
              items:
                type: string
            external_ids:
              type: array
              items:
                type: string
    ErrorResponse:
      type: object
      description: Uniform error envelope for every refused request.
      properties:
        status:
          type: string
          enum: [blocked]
        error:
          type: string
          description: Machine-readable error code.
          enum:
            - unauthorized
            - not_found
            - method_not_allowed
            - invalid_request
            - payload_too_large
            - unsupported_media_type
            - plan_mismatch
            - plan_state_exists
            - stale_plan_version
            - proposal_mismatch
            - proposal_expired
            - proposal_hash_mismatch
            - confirmation_required
            - attempt_mismatch
            - delivery_blocked
            - state_conflict
            - validation_failed
            - context_blocked
            - reconciliation_blocked
            - provider_error
            - internal_error
        detail:
          type: string
          description: Human-readable detail; present for some error codes.
        validation:
          $ref: "#/components/schemas/ValidationSummary"
        reconciliation:
          type: object
          additionalProperties: true
          description: Present when error is reconciliation_blocked; same shape as startCoachSession's reconciliation field.
        current_plan_id:
          type: string
          description: Present when error is plan_mismatch or plan_state_exists.
        current_plan_version:
          type: integer
          description: Present when error is stale_plan_version or plan_state_exists.
        unresolved_delivery:
          type: [object, "null"]
          description: Present when error is attempt_mismatch; the reservation this account actually holds, in the same shape startCoachSession reports.
          additionalProperties: true
      required:
        - status
        - error
