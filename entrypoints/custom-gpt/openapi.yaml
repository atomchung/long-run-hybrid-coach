            instance_id: {type: string, pattern: "^[a-z0-9](?:[a-z0-9._-]{0,62}[a-z0-9])?$"}
            configuration_binding: {type: string, pattern: "^[0-9a-f]{64}$"}
          required: [environment, instance_id, configuration_binding]
        source_git_commit:
