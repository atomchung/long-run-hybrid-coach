openapi: 3.1.0
info:
  title: Coach Gateway
  version: "1.0"
  description: Agent-neutral HTTP surface over one athlete's own Coach Loop PlanState.
servers:
  - url: https://YOUR-GATEWAY-DOMAIN
    description: Replace with your HTTPS tunnel or host; never commit a real domain.
security:
  - intervalsOAuth:
      - "ACTIVITY:READ"
      - "WELLNESS:READ"
      - "CALENDAR:WRITE"
      - "SETTINGS:READ"
paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Runtime identity readiness check
      description: Call only to verify the gateway is reachable and its release plus privacy-safe deployment configuration identities are bound; needs no authentication and returns no private configuration values.
      security: []
      x-openai-isConsequential: false
      responses:
        "200":
          description: The gateway is reachable, with explicit ready or blocked runtime identity state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/coach/session:
    post:
      operationId: startCoachSession
      summary: Start or refresh the current coaching session
      description: Call before answering any today, this-week, plan, or reassessment question; the returned PlanState is the only durable memory across conversations.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: The current PlanState and a freshly built CoachContext, or an explicit no-plan-state answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/permissions:
    get:
      operationId: inspectIntervalsPermissions
      summary: Safely inspect the connected Intervals permission state
      description: Call only when debugging a connection. Returns normalized OAuth scope names and a bounded SETTINGS read classification; never returns provider settings or credentials.
      x-openai-isConsequential: false
      responses:
        "200":
          description: The stored scope observation and current SETTINGS read classification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDiagnosticResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/availability:
    post:
      operationId: recordAthleteAvailability
      summary: Remember which weekdays the athlete can train
      description: Call as soon as the athlete says which days they can or cannot train, so the next conversation does not ask again; needs no confirmation and changes no plan. A day lost or gained goes in week as unavailable_days/available_days, and the rest of the standing week is untouched; "this week I can only do X and Y" is week.only_days; a permanent change goes in recurring. Never re-ask about days the athlete did not mention, and never send the complement of what they said.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRecordRequest"
      responses:
        "200":
          description: What is now stored, plus the availability in force for the current week.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityRecordResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/strength-report:
    post:
      operationId: recordStrengthExecution
      summary: Remember one lift the athlete reports having done
      description: Call when the athlete says what they actually lifted (exercise, sets, weight, reps), which no device records; needs no confirmation and changes no plan. Send the sets exactly as stated and never a figure you inferred. Re-reporting the same movement on the same day replaces what was stored -- that is how a correction like "70, not 65" works -- and adding sets later means sending that movement's sets as they now stand. Re-sending an identical report stores nothing twice.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrengthReportRequest"
      responses:
        "200":
          description: The stored report, and whether this exact report was already held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrengthReportResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/initialization/prepare:
    post:
      operationId: prepareCoachInitialization
      summary: Preview the first plan for an account that has none
      description: Call only after startCoachSession returned no_plan_state, with one small initialization_request built from what the athlete told you; returns the exact first plan to show them before asking for one confirmation, and writes nothing.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializationPrepareRequest"
      responses:
        "200":
          description: The exact first plan that would be committed, bound to a proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializationPrepareResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/initialization/apply:
    post:
      operationId: initializeCoachPlan
      summary: Commit the confirmed first plan
      description: Call immediately after the athlete confirms the preview from prepareCoachInitialization, with the identical initialization_request and the returned proposal, to create this account's PlanState.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializationApplyRequest"
      responses:
        "200":
          description: The created PlanState, or the prior success if this exact initialization already ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializationApplyResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/decision/prepare:
    post:
      operationId: prepareCoachDecision
      summary: Preview a weekly plan change
      description: Call once a weekly change is needed, with one small change_request; returns the exact before/after values to show the athlete before asking for one confirmation, and writes nothing.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionPrepareRequest"
      responses:
        "200":
          description: The exact before/after values of the projected change, bound to a proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionPrepareResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/decision/apply:
    post:
      operationId: applyCoachDecision
      summary: Commit a confirmed weekly plan change
      description: Call immediately after the athlete confirms the preview from prepareCoachDecision, with the identical context and change_request plus the returned proposal, to commit the new PlanState version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionApplyRequest"
      responses:
        "200":
          description: The committed PlanState version, or the prior success if this exact decision was already applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionApplyResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/delivery/prepare:
    post:
      operationId: prepareWorkoutDelivery
      summary: Preview workouts selected for delivery
      description: Call to build the exact preview of the selected sessions before asking the athlete for one delivery confirmation; writes nothing.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryPrepareRequest"
      responses:
        "200":
          description: The exact preview batch and an opaque delivery_set bound to a proposal_hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryPrepareResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/delivery/publish:
    post:
      operationId: publishWorkoutDelivery
      summary: Publish a confirmed workout delivery
      description: Call immediately after the athlete confirms the preview from prepareWorkoutDelivery, with the same delivery_set and proposal_hash unchanged, to publish to Intervals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryPublishRequest"
      responses:
        "200":
          description: Delivery evidence observed up to intervals_accepted. This never means Garmin Connect or the watch received the workout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryPublishResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/delivery/withdraw/prepare:
    post:
      operationId: prepareDeliveryWithdrawal
      summary: Preview which superseded workouts would be removed from Intervals
      description: Call when a confirmed change left a previously delivered workout on the calendar, to show the athlete exactly which Intervals events would be removed; writes nothing.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalPrepareRequest"
      responses:
        "200":
          description: The exact events that would be withdrawn and an opaque withdrawal_set bound to a proposal_hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalPrepareResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/delivery/withdraw/apply:
    post:
      operationId: applyDeliveryWithdrawal
      summary: Remove the confirmed superseded workouts from Intervals
      description: Call immediately after the athlete confirms the preview from prepareDeliveryWithdrawal, with the same withdrawal_set and proposal_hash unchanged. Only events this product wrote are ever removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalApplyRequest"
      responses:
        "200":
          description: The events verified gone from the athlete's calendar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalApplyResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/coach/delivery/attempt/clear:
    post:
      operationId: clearDeliveryAttempt
      summary: Give up on an unfinished delivery so the plan can change again
      description: Call only when startCoachSession returned delivery.unresolved_delivery, retrying the same set is not possible because this conversation never prepared it, and the athlete has looked at their Intervals calendar and confirmed it is what they want to keep. Prefer retrying the original delivery whenever the conversation still holds it. This reconciles nothing and repairs nothing on Intervals; it only stops the unfinished delivery from blocking plan changes, and hands responsibility for the listed operations to the athlete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryAttemptClearRequest"
      responses:
        "200":
          description: The reservation is released, or there was none to release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAttemptClearResponse"
        default:
          description: The request was refused; see the error code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    intervalsOAuth:
      type: oauth2
      description: The token URL is this gateway's own OAuth proxy, not Intervals' token endpoint; the client secret never leaves the gateway.
      flows:
        authorizationCode:
          authorizationUrl: https://intervals.icu/oauth/authorize
          tokenUrl: https://YOUR-GATEWAY-DOMAIN/oauth/intervals/token
          scopes:
            "ACTIVITY:READ": Read the athlete's Intervals.icu activities.
            "WELLNESS:READ": Read the athlete's Intervals.icu wellness data.
            "CALENDAR:WRITE": Read the athlete's Intervals.icu calendar and write workouts to it.
            "SETTINGS:READ": Read the athlete's Intervals settings only for the bounded connection diagnostic.
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        error:
          type: [string, "null"]
        api_version:
          type: string
        release_identity:
          type: [object, "null"]
          additionalProperties: false
          properties:
            release_id: {type: string}
            git_commit: {type: string}
            instructions_sha256: {type: string}
            openapi_sha256: {type: string}
            gateway_artifact_sha256: {type: string}
            gateway_domain: {type: string}
          required: [release_id, git_commit, instructions_sha256, openapi_sha256, gateway_artifact_sha256, gateway_domain]
        deployment_identity:
          type: [object, "null"]
          additionalProperties: false
          properties:
            environment: {type: string, pattern: "^[a-z](?:[a-z0-9-]{0,30}[a-z0-9])?$"}
            instance_id: {type: string, pattern: "^[a-z0-9](?:[a-z0-9._-]{0,62}[a-z0-9])?$"}
            configuration_binding: {type: string, pattern: "^[0-9a-f]{64}$"}
          required: [environment, instance_id, configuration_binding]
      required:
        - status
        - error
        - api_version
        - release_identity
        - deployment_identity
    ValidationSummary:
      type: object
      properties:
        status:
          type: string
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    PermissionDiagnosticResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        granted_scopes:
          type: [array, "null"]
          items:
            type: string
        settings_read:
          type: string
          enum: [readable, denied, invalid_or_expired]
      required:
        - status
        - api_version
        - generated_at
        - granted_scopes
        - settings_read
    SessionRequest:
      type: object
      description: Every field is optional. Omission means "not confirmed this turn", never a convenient default.
      properties:
        as_of:
          type: [string, "null"]
          description: ISO-8601 instant to evaluate the plan as of; defaults to the current time.
        timezone:
          type: string
          description: The athlete's own IANA timezone, which decides what "today" and "the next session" mean. Send it whenever you know where the athlete is; it defaults to Asia/Taipei, which is wrong for anyone else near midnight.
        available_days:
          type: array
          items:
            type: string
          description: Confirmed available weekday names for this week (e.g. mon, tue); omit when not yet confirmed.
        session_minutes:
          type: [integer, "null"]
          description: Confirmed minutes available for today's session.
        red_flags:
          type: object
          description: Tri-state per symptom -- true, false, or omitted/null for unassessed. Never infer a value the athlete did not give.
          properties:
            pain:
              type: [boolean, "null"]
            illness:
              type: [boolean, "null"]
            chest_pain:
              type: [boolean, "null"]
            dizziness:
              type: [boolean, "null"]
            unusual_symptoms:
              type: [boolean, "null"]
        all_clear:
          type: boolean
          description: Shorthand for "no red flags reported"; sets every red_flags entry not otherwise given to false.
        leg_fatigue:
          type: string
          enum: [normal, elevated, severe, unknown]
          description: Defaults to unknown.
        soreness:
          type: string
          enum: [normal, elevated, severe, unknown]
          description: Defaults to unknown.
        schedule_changed:
          type: [boolean, "null"]
        equipment_changed:
          type: [boolean, "null"]
        unknowns:
          type: array
          items:
            type: string
          description: Additional athlete-reported unknowns to carry into the context.
    SessionResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed, no_plan_state]
        api_version:
          type: string
        generated_at:
          type: string
        context_id:
          type: [string, "null"]
        plan_state:
          type: object
          properties:
            present:
              type: boolean
            plan_id:
              type: [string, "null"]
            plan_version:
              type: [integer, "null"]
            current_plan:
              type: [object, "null"]
              additionalProperties: true
              description: The full current PlanState. Opaque -- read the fields you need to reason about it; never hand-edit or reconstruct it.
        context:
          type: [object, "null"]
          additionalProperties: true
          description: >-
            The full CoachContext for this turn. Read the fields you need to reason about;
            never hand-edit or reconstruct it, and pass it back verbatim as `context` to
            prepareCoachDecision and applyCoachDecision.
            `cycle_sessions` is this cycle's planned-versus-actual record: one row per
            prescribed session whose day has passed (today is not in it -- read today from
            `current_calendar` and `recent_actuals`), each carrying its prescription beside
            whatever came back for it. Its `activity_evidence` says why that activity is
            what it is: `attached` means an activity was matched to this session and says
            nothing about how it went; `none_found` means this build read that day and no
            activity of that sport attached; `athlete_reported` means no device recorded it
            and the athlete says they trained it, which is training rather than a missed
            session, though it does not say the prescription was completed;
            `other_activity_same_day` means that sport was
            trained that day but attached elsewhere, which is a matching question and not a
            missed session; `outside_evidence_window` means the day predates anything this
            build read. `match_status` is the PlanState's own value for the session.
            These are observations, not conclusions. What an absence or a shortfall means,
            and what should change because of it, is a coaching judgment made from the goal,
            availability, recovery, constraints, the athlete's own account, and the rest of
            the cycle -- never read off one field, and never a threshold or a percentage.
            `average_hr` and `average_pace_sec_per_km` are whole-activity averages spanning
            warm-up and recoveries, so on a session that prescribed structure they are not a
            reading of the work.
        validation:
          type: [object, "null"]
          properties:
            status:
              type: string
            errors:
              type: array
              items:
                type: string
            warnings:
              type: array
              items:
                type: string
        unknowns:
          type: array
          items:
            type: string
        delivery:
          type: [object, "null"]
          properties:
            max_delivery_state:
              type: string
              description: The furthest delivery evidence this product can ever observe.
            sessions:
              type: array
              items:
                type: object
                properties:
                  session_id:
                    type: string
                  scheduled_date:
                    type: string
                  sport:
                    type: string
                  match_status:
                    type: string
                  publish_supported:
                    type: [boolean, "null"]
                  delivery_state:
                    type: [string, "null"]
                  external_id:
                    type: [string, "null"]
                  superseded_external_id:
                    type: [string, "null"]
                    description: An Intervals event a confirmed change left on the calendar. When present, Intervals still shows the athlete a workout the plan no longer describes; offer prepareDeliveryWithdrawal, or publish the session's current content, which replaces that same event.
            unresolved_delivery:
              type: [object, "null"]
              description: A delivery this account started and could not finish. When present, no plan change is possible until it is resolved, and Intervals may hold a workout the plan does not describe. Tell the athlete before doing anything else, and resolve it by retrying the identical set if this conversation still has it, or by clearDeliveryAttempt once they have checked their calendar.
              properties:
                attempt_id:
                  type: string
                  description: Pass this back to clearDeliveryAttempt. It is the only accepted identification of this reservation.
                kind:
                  type: string
                  description: delivery when the unfinished set was writing workouts, withdrawal when it was removing them.
                opened_at:
                  type: string
                plan_id:
                  type: string
                plan_version:
                  type: integer
                  description: The plan version this delivery was bound to.
                session_ids:
                  type: array
                  description: Every session the unfinished set covered.
                  items:
                    type: string
                provider_effects_outstanding:
                  type: boolean
                  description: True when at least one operation may already have reached Intervals; those are listed under operations. False means nothing reached Intervals and only the block itself remains.
                next_actions:
                  type: array
                  description: What may be done from here - retry_same_set, or clear_delivery_attempt via clearDeliveryAttempt. Retrying is always preferred; it converges without writing anything twice.
                  items:
                    type: string
                operations:
                  type: array
                  description: The operations Intervals may hold that this plan does not record. Empty when nothing reached Intervals.
                  items:
                    type: object
                    properties:
                      session_id:
                        type: string
                      operation:
                        type: string
                        description: upsert for a workout write, delete for a withdrawal.
                      state:
                        type: string
                        description: How far this operation got before it stopped.
                      external_id:
                        type: [string, "null"]
                        description: The Intervals event this operation may have created or removed, when one is known.
        reconciliation:
          type: [object, "null"]
          additionalProperties: true
          description: The deterministic planned-vs-actual reconciliation applied during this refresh. status is deferred when an unresolved delivery blocked it - the plan is still correct as reported, but a session that was trained may still read as planned until the delivery is resolved.
        pre_plan_observations:
          type: [object, "null"]
          description: Present only when status is no_plan_state. What is already on record for an athlete with no plan; read it before asking, and ask only for what is missing.
          properties:
            athlete_evidence:
              type: [object, "null"]
              additionalProperties: true
              description: Availability and lifts this athlete already reported, or null when they have reported nothing.
            recent_training:
              type: [object, "null"]
              additionalProperties: true
              description: Recent activities read from Intervals, or null when that read failed -- in which case unknowns says so. Never treat null as "this athlete has not trained".
    AvailabilityRecordRequest:
      type: object
      description: At least one of recurring and week is required. Weekday names are mon, tue, wed, thu, fri, sat, sun.
      properties:
        timezone:
          type: string
          description: The athlete's own IANA timezone, which decides which week is the current one. Defaults to Asia/Taipei.
        recurring:
          type: object
          description: The athlete's normal week, which stands until they say otherwise. Sending it again replaces the previous one.
          properties:
            available_days:
              type: array
              items:
                type: string
              description: Weekdays the athlete can train.
            unavailable_days:
              type: array
              items:
                type: string
              description: Weekdays the athlete cannot train. Never fill this in as the complement of available_days; send only days the athlete actually named.
        week:
          type: object
          description: One week, layered onto the athlete's normal week rather than replacing it. A day lost or gained goes in available_days/unavailable_days and the rest of the standing week is untouched; "this week I can only do X and Y" is only_days instead, the week restated in full. only_days is mutually exclusive with the two day lists.
          properties:
            week_start:
              type: string
              description: Optional, and rarely needed. Any ISO date inside the target week; defaults to the current week.
            available_days:
              type: array
              items:
                type: string
              description: Weekdays gained this week, on top of the athlete's normal week.
            unavailable_days:
              type: array
              items:
                type: string
              description: Weekdays lost this week, out of the athlete's normal week.
            only_days:
              type: array
              items:
                type: string
              description: This week in full, replacing the normal week for this week only. Mutually exclusive with available_days and unavailable_days.
    AvailabilityRecordResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed]
        api_version:
          type: string
        generated_at:
          type: string
        athlete_evidence_version:
          type: integer
        recurring:
          type: [object, "null"]
          additionalProperties: true
          description: The normal week now stored, with when it was recorded.
        week:
          type: [object, "null"]
          additionalProperties: true
          description: The single-week statement just recorded, when this call made one.
        effective_this_week:
          type: [object, "null"]
          additionalProperties: true
          description: The availability in force for the current week, after this call. Read it back to the athlete rather than restating what you sent.
      required:
        - status
        - api_version
        - generated_at
    StrengthReportRequest:
      type: object
      required:
        - exercise
        - sets
      properties:
        timezone:
          type: string
          description: The athlete's own IANA timezone, which decides what counts as a future date. Defaults to Asia/Taipei.
        date:
          type: string
          description: The day the athlete performed this, as an ISO date. Optional; defaults to today in the athlete's own timezone. May not be in their future.
        exercise:
          type: string
          description: The movement as the athlete named it, e.g. bench press.
        category:
          type: string
          description: Optional metadata. Send only when the athlete volunteered it or the plan already names it; never ask the athlete which body part a movement trains.
        sets:
          type: array
          minItems: 1
          description: One entry per set, exactly as reported. Omit a measurement the athlete did not give rather than estimating it.
          items:
            type: object
            properties:
              set:
                type: integer
                minimum: 1
                description: Position of this set within the exercise. Optional; defaults to this set's position in the list.
              weight_kg:
                type: [number, "null"]
              assist_kg:
                type: [number, "null"]
                description: Assistance load, for assisted pull-ups and similar.
              reps:
                type: [integer, "null"]
              rpe:
                type: [number, "null"]
        notes:
          type: array
          items:
            type: string
          description: What the athlete said about the session, in their words, e.g. that the last set was cut short.
    StrengthReportResponse:
      type: object
      properties:
        status:
          type: string
          enum: [passed]
        api_version:
          type: string
        generated_at:
          type: string
        report_id:
          type: string
          description: Derived from the report's own content, so the same report always has the same id.
        idempotent_replay:
          type: boolean
          description: True when this exact report was already stored; nothing was added.
        replaced:
          type: [object, "null"]
          additionalProperties: true
          description: The record this report displaced, when re-reporting the same movement on the same day replaced an earlier one. Null when it replaced nothing.
        report:
          type: object
          additionalProperties: true
          description: The stored report, including when it was recorded.
        report_count:
          type: integer
          description: How many reports this athlete now has on record.
      required:
        - status
        - api_version
        - generated_at
        - report_id
        - idempotent_replay
    InitializationPrepareRequest:
      type: object
      required:
        - initialization_request
      properties:
        initialization_request:
          $ref: "#/components/schemas/CoachInitializationRequest"
    InitializationPrepareResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: string
        plan_version:
          type: integer
        proposal:
          type: string
          description: Binds this exact first plan to this athlete until expires_at. Pass back unchanged to initializeCoachPlan.
        expires_at:
          type: string
          description: After this instant the proposal is refused; re-run prepareCoachInitialization to get a fresh one.
        confirmation_required:
          type: boolean
        preview:
          $ref: "#/components/schemas/InitialPlanPreview"
        validation:
          $ref: "#/components/schemas/ValidationSummary"
        warnings:
          type: array
          items:
            type: string
        unknowns:
          type: array
          items:
            type: string
          description: What this plan does not stand on, including every baseline the athlete has not measured. Say these out loud with the preview.
    InitialPlanPreview:
      type: object
      description: The exact first plan, in its own values, plus the facts it was built from. Show these values to the athlete; never restate the plan from memory.
      properties:
        plan_id:
          type: string
        plan_version:
          type: integer
        goal:
          type: object
          properties:
            outcome:
              type: string
            measurement_protocol:
              type: string
        cycle:
          type: object
          properties:
            start:
              type: string
            end:
              type: string
            primary_adaptation:
              type: string
            maintenance_adaptation:
              type: [string, "null"]
        week:
          type: object
          properties:
            start:
              type: string
            intent:
              type: string
        sessions:
          type: array
          items:
            type: object
            properties:
              session_id:
                type: string
              scheduled_date:
                type: string
              sport:
                type: string
              adaptation:
                type: string
              cost:
                type: string
              priority:
                type: string
              planned_minutes:
                type: [integer, "null"]
              prescription:
                type: string
                description: The athlete-readable rendering of this session's plan, generated by the gateway. Show it; never restate it.
              time_window:
                type: [string, "null"]
              plan:
                $ref: "#/components/schemas/SessionPlan"
        weekly_planned_minutes:
          type: [integer, "null"]
        hard_sessions:
          type: integer
        athlete_baseline:
          type: object
          additionalProperties: true
          description: The baselines this plan stands on. Anything the athlete has not measured is null here, and named in unknowns.
        availability:
          type: [object, "null"]
          description: The training days and equipment the plan was built from, echoed back so the athlete can correct a misheard fact.
          properties:
            days:
              type: array
              items:
                type: string
            equipment:
              type: array
              items:
                type: string
        summary:
          type: string
        evidence:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              observation:
                type: string
        unknowns:
          type: array
          items:
            type: string
    InitializationApplyRequest:
      type: object
      required:
        - initialization_request
        - proposal
        - confirmed
      properties:
        initialization_request:
          $ref: "#/components/schemas/CoachInitializationRequest"
        proposal:
          type: string
          description: The proposal returned by prepareCoachInitialization, unchanged.
        confirmed:
          type: boolean
          description: Must be true. Set only after the athlete has confirmed the preview.
    InitializationApplyResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: string
        plan_version:
          type: integer
        idempotent_replay:
          type: boolean
          description: True when this exact initialization already ran and this request replayed that prior success.
        validation:
          $ref: "#/components/schemas/ValidationSummary"
    CoachInitializationRequest:
      type: object
      description: >-
        The first plan, carrying coaching judgment and athlete facts only. The gateway
        builds the PlanState from it and owns its schema, id, version, status, session
        ids, cycle end date, week start and delivery bookkeeping. Never send a PlanState.
      required:
        - goal
        - cycle
        - week_intent
        - sessions
        - summary
        - evidence
      properties:
        goal:
          type: object
          required:
            - outcome
            - measurement_protocol
          properties:
            outcome:
              type: string
              description: What the athlete is training for, in their own words.
            measurement_protocol:
              type: string
              description: How they will tell at day 28 whether it worked.
        cycle:
          type: object
          description: Where the 28 days point. The end date is derived from start.
          required:
            - start
            - primary_adaptation
            - planned_evidence
            - adjust_conditions
            - stop_conditions
          properties:
            start:
              type: string
              description: ISO date the block starts. The first week starts with it.
            primary_adaptation:
              type: string
              enum: [aerobic_base, threshold, vo2, strength, hypertrophy, power, recovery]
            maintenance_adaptation:
              type: [string, "null"]
              enum: [aerobic_base, threshold, vo2, strength, hypertrophy, power, recovery, null]
            planned_evidence:
              type: array
              minItems: 1
              items:
                type: string
              description: What the block should produce if it is working.
            adjust_conditions:
              type: array
              minItems: 1
              items:
                type: string
            stop_conditions:
              type: array
              minItems: 1
              items:
                type: string
        week_intent:
          type: string
          description: What the first week is for.
        availability:
          type: object
          description: When the athlete can train and with what. Echoed in the preview for them to correct; the sessions are where it takes effect.
          properties:
            days:
              type: array
              items:
                type: string
            equipment:
              type: array
              items:
                type: string
        baselines:
          type: object
          description: >-
            Only what the athlete actually supports. Leave out, or send null, anything
            they have not measured -- a missing anchor stays unknown and is reported back
            in unknowns. Never estimate one to fill the field, and never prescribe an
            exact pace, BPM or kg that no baseline here supports.
          properties:
            threshold_pace_sec_per_km:
              type: [integer, "null"]
            max_hr:
              type: [integer, "null"]
            easy_hr_ceiling:
              type: [integer, "null"]
            longest_recent_run_km:
              type: [number, "null"]
            weekly_volume_km_4wk_avg:
              type: [number, "null"]
            max_session_minutes:
              type: [integer, "null"]
            strength_loads:
              type: array
              description: One entry per lift the athlete has a real figure for. An assisted lift records assist_kg and leaves load_kg null.
              items:
                type: object
                required:
                  - exercise
                properties:
                  exercise:
                    type: string
                  load_kg:
                    type: [number, "null"]
                  assist_kg:
                    type: [number, "null"]
                  scheme:
                    type: [string, "null"]
                  display_name:
                    type: string
                    description: How the athlete says this lift, when a plan names it in their wording.
        sessions:
          type: array
          minItems: 1
          description: The first week's sessions. There is no default week; every session is one you decided on.
          items:
            $ref: "#/components/schemas/InitialSession"
        summary:
          type: string
          description: One line saying what this plan is and why, in the athlete's own language.
        evidence:
          type: array
          minItems: 1
          description: What the athlete actually told you, and where it came from.
          items:
            type: object
            required:
              - field
              - observation
            properties:
              field:
                type: string
              observation:
                type: string
        unknowns:
          type: array
          items:
            type: string
          description: What you could not establish. The gateway adds every unmeasured baseline to these.
    InitialSession:
      type: object
      description: One session of the first week. The gateway names it and derives whether it is hard and whether it can be delivered.
      required:
        - sport
        - scheduled_date
        - purpose
        - adaptation
        - body_stress
        - cost
        - priority
        - planned_minutes
        - plan
        - fallback
      properties:
        sport:
          type: string
          enum: [running, strength, mobility, recovery, rest]
        scheduled_date:
          type: string
          description: ISO date, inside the first week (cycle start through cycle start plus six days).
        purpose:
          type: string
          description: What the session is for, and the title a strength day reaches the athlete's watch under. Intent only, never a prescription - a number wearing a unit (4:30/km, 5km, 80kg, 150bpm, 85%) is refused and the error names it. A digit on its own is fine. Every number the athlete executes belongs in plan.
        adaptation:
          type: string
          enum: [aerobic_base, threshold, vo2, strength, hypertrophy, power, recovery]
        body_stress:
          type: string
          enum: [lower, upper, full, systemic]
        cost:
          type: string
          enum: [easy, moderate, hard]
        priority:
          type: string
          enum: [anchor, flexible, optional]
        planned_minutes:
          type: integer
        plan:
          $ref: "#/components/schemas/SessionPlan"
        time_window:
          type: [string, "null"]
          description: Optional, for example morning or evening.
        fallback:
          type: object
          required:
            - action
            - description
          properties:
            action:
              type: string
              enum: [reduce, move, replace, rest]
            description:
              type: string
    SessionPlan:
      description: >-
        What the session prescribes, structured, classified by how it is executed rather
        than by which sport it is: time_axis for work laid out along time or distance
        with an intensity target, movement_list for work laid out as movements with sets
        and loads, unstructured for a session that declares no numbers at all (mobility,
        recovery, rest — and a strength session whose athlete declined to enumerate
        movements, which adopts with a warning; a run may never be unstructured). No
        request in this API accepts a prescription: the athlete-readable sentence is
        rendered from this object and returned in the preview, so it cannot say
        something this object does not.
      oneOf:
        - $ref: "#/components/schemas/TimeAxisPlan"
        - $ref: "#/components/schemas/MovementListPlan"
        - $ref: "#/components/schemas/UnstructuredPlan"
    TimeAxisPlan:
      type: object
      description: What the watch executes for a running session. One target kind per session -- never mix pace and heart rate.
      required:
        - kind
        - name
        - steps
      properties:
        kind:
          type: string
          enum: [time_axis]
        name:
          type: string
          description: At most 80 characters; the title the athlete sees on the watch.
        steps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WorkoutBlock"
    MovementListPlan:
      type: object
      description: What the athlete lifts, so the plan's numbers can be compared with what came back. It never reaches the watch as structure -- a movement list publishes as a titled calendar entry.
      required:
        - kind
        - movements
      properties:
        kind:
          type: string
          enum: [movement_list]
        movements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StrengthMovement"
    UnstructuredPlan:
      type: object
      description: A session that declares no numbers -- mobility, recovery, rest. It carries no field but its own kind, so nothing can ride along inside it.
      required:
        - kind
      properties:
        kind:
          type: string
          enum: [unstructured]
    StrengthMovement:
      type: object
      description: One planned movement. load_basis says why a load is what it is, so an absent kg figure is never a guess.
      required:
        - exercise
        - display_name
        - sets
        - reps
        - load_kg
        - assist_kg
        - load_basis
      properties:
        exercise:
          type: string
          description: The canonical key this lift's baseline uses, so the two compare field to field. Never shown to the athlete.
        display_name:
          type: string
          description: The movement as the athlete reads it, in their own language. This is the name that reaches their screen and the watch's calendar entry, so give it even when it matches the key.
        sets:
          type: integer
          minimum: 1
        reps:
          type: [integer, "null"]
          description: Null for a set taken to failure.
        load_kg:
          type: [number, "null"]
        assist_kg:
          type: [number, "null"]
        load_basis:
          type: string
          enum: [measured_baseline, bodyweight, pending_confirmation]
          description: measured_baseline needs a load_kg or assist_kg figure matching a baseline strength_load; bodyweight and pending_confirmation must leave both null.
    WorkoutBlock:
      type: object
      description: One work step, or one repeat wrapping work steps.
      required:
        - kind
      properties:
        kind:
          type: string
          enum: [work, repeat]
        name:
          type: string
          description: Work steps only.
        duration:
          $ref: "#/components/schemas/WorkoutDuration"
        target:
          $ref: "#/components/schemas/WorkoutTarget"
        repetitions:
          type: integer
          description: Repeat blocks only.
        steps:
          type: array
          description: Repeat blocks only; work steps, never another repeat. A heart-rate ceiling cannot be used inside a repeat.
          items:
            type: object
            required:
              - kind
              - name
              - duration
              - target
            properties:
              kind:
                type: string
                enum: [work]
              name:
                type: string
              duration:
                $ref: "#/components/schemas/WorkoutDuration"
              target:
                $ref: "#/components/schemas/WorkoutTarget"
    WorkoutDuration:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum: [time, distance]
        seconds:
          type: integer
          description: Required when kind is time.
        meters:
          type: integer
          description: Required when kind is distance.
    WorkoutTarget:
      type: object
      description: open leaves intensity to the athlete; pace needs a measured threshold pace; hr_ceiling is an upper bound only and needs a measured max heart rate.
      required:
        - kind
      properties:
        kind:
          type: string
          enum: [open, pace, hr_ceiling]
        unit:
          type: string
          enum: [sec_per_km, bpm]
        low_seconds_per_km:
          type: integer
        high_seconds_per_km:
          type: integer
        ceiling_bpm:
          type: integer
    SessionChange:
      type: object
      description: >-
        One operation on one session; each session may appear at most once. keep, move,
        reduce and replace name an existing session_id; add creates a session and the
        gateway names it. There is no remove: to drop a session, replace it with a rest
        or recovery session so the decision stays visible in the plan's history. `plan`
        is required for replace and add, and required on a reduce whose session is laid
        out along time -- shortening such a session without saying what it now holds
        would leave what the watch executes describing the session it used to be. On any
        other reduce `plan` is optional and the stored one stands, so restate it whenever
        the reduce changes what the session prescribes -- fewer sets, a different lift --
        and leave it out when only the duration moves.
      required:
        - operation
      properties:
        operation:
          type: string
          enum: [keep, move, reduce, replace, add]
        session_id:
          type: string
          description: Required for keep, move, reduce and replace. Never sent for add.
        scheduled_date:
          type: string
          description: ISO date. Required for move and add; optional for replace.
        planned_minutes:
          type: integer
          description: Required for reduce (must be below the current value), replace and add.
        plan:
          $ref: "#/components/schemas/SessionPlan"
        purpose:
          type: string
          description: Why this session exists, and the title a strength day reaches the athlete's watch under. Required for replace and add; optional for reduce and keep. On keep this is the only field you may send -- it rewords the label without moving the schedule, structure, or match_status, for example fixing a watch title that reads unclear. Intent only, never a prescription - a number wearing a unit (4:30/km, 5km, 80kg, 150bpm, 85%) is refused and the error names it. A digit on its own is fine. Every number the athlete executes belongs in plan.
        sport:
          type: string
          enum: [running, strength, mobility, recovery, rest]
          description: Required for add; for replace it defaults to the session's current sport.
        adaptation:
          type: string
          enum: [aerobic_base, threshold, vo2, strength, hypertrophy, power, recovery]
          description: Required for replace and add.
        cost:
          type: string
          enum: [easy, moderate, hard]
          description: Required for replace and add.
        body_stress:
          type: string
          enum: [lower, upper, full, systemic]
          description: Required for add; kept as-is for replace unless given.
        priority:
          type: string
          enum: [anchor, flexible, optional]
          description: Required for add; kept as-is for replace unless given.
        time_window:
          type: [string, "null"]
          description: Optional, for example morning or evening.
        fallback:
          type: object
          description: What to do when the session cannot be done as written. Required for add.
          required:
            - action
            - description
          properties:
            action:
              type: string
              enum: [reduce, move, replace, rest]
            description:
              type: string
    CoachChangeRequest:
      type: object
      description: >-
        One small coaching change, carrying coaching judgment only. The gateway projects
        it onto the current PlanState: it copies every field you did not change, and it
        owns the resulting PlanState and DecisionEvent, their versions, ids, hashes,
        timestamps, and delivery bookkeeping. Never send a PlanState or a DecisionEvent.
      required:
        - summary
        - reason_codes
        - evidence
        - goal_effect
        - next_review_condition
      properties:
        summary:
          type: string
          description: One line saying what changes and why, in the athlete's own language.
        reason_codes:
          type: array
          minItems: 1
          description: Why this change is being made; at least one, no repeats.
          items:
            type: string
            enum:
              - actual_load_above_plan
              - actual_load_below_plan
              - multi_signal_recovery_down
              - recovery_signal_mixed
              - lower_body_stress_conflict
              - quality_session_conflict
              - schedule_or_equipment_changed
              - goal_priority_changed
              - data_stale_or_missing
              - pain_or_illness_flag
              - plan_kept_no_material_change
        evidence:
          type: array
          minItems: 1
          description: What you actually read, and where. Never cite evidence the session response did not contain.
          items:
            type: object
            required:
              - field
              - observation
            properties:
              field:
                type: string
                description: Where you read it, for example recovery_trends.hrv or recent_actuals.
              observation:
                type: string
                description: What it said.
        goal_effect:
          type: object
          required:
            - week
            - cycle
          properties:
            week:
              type: string
              description: What this does to the current week.
            cycle:
              type: string
              description: What this does to the 28-day direction.
        next_review_condition:
          type: string
          description: What should trigger the next look at this plan.
        unknowns:
          type: array
          items:
            type: string
          description: What you could not establish. The gateway adds the context's own unknowns to these.
        sessions:
          type: array
          description: The session changes. Omit or leave empty when only the goal, cycle or week text changes.
          items:
            $ref: "#/components/schemas/SessionChange"
        goal:
          type: object
          description: Send only when the 28-day outcome itself changes; both fields are then required.
          required:
            - outcome
            - measurement_protocol
          properties:
            outcome:
              type: string
            measurement_protocol:
              type: string
        cycle:
          type: object
          description: Send only the cycle fields that change; everything else is kept.
          properties:
            start:
              type: string
            end:
              type: string
            primary_adaptation:
              type: string
              enum: [aerobic_base, threshold, vo2, strength, hypertrophy, power, recovery]
            maintenance_adaptation:
              type: [string, "null"]
              enum: [aerobic_base, threshold, vo2, strength, hypertrophy, power, recovery, null]
            planned_evidence:
              type: array
              items:
                type: string
            adjust_conditions:
              type: array
              items:
                type: string
            stop_conditions:
              type: array
              items:
                type: string
        athlete_baseline:
          type: object
          description: >-
            Send only the baseline fields the evidence has moved; everything else is
            kept. Values are measured figures, never null -- clearing an anchor is not
            available here. strength_loads updates or adds the movements it names and
            touches no other movement; naming load_kg or assist_kg replaces that pair,
            scheme and display_name are kept unless restated.
          properties:
            threshold_pace_sec_per_km:
              type: integer
            max_hr:
              type: integer
            easy_hr_ceiling:
              type: integer
            max_session_minutes:
              type: integer
            longest_recent_run_km:
              type: number
            weekly_volume_km_4wk_avg:
              type: number
            strength_loads:
              type: array
              minItems: 1
              items:
                type: object
                required:
                  - exercise
                properties:
                  exercise:
                    type: string
                  load_kg:
                    type: number
                  assist_kg:
                    type: number
                  scheme:
                    type: [string, "null"]
                  display_name:
                    type: string
        week:
          type: object
          description: Send only the week fields that change.
          properties:
            start:
              type: string
            intent:
              type: string
    ChangePreviewSession:
      type: object
      properties:
        session_id:
          type: [string, "null"]
        scheduled_date:
          type: [string, "null"]
        sport:
          type: [string, "null"]
        adaptation:
          type: [string, "null"]
        cost:
          type: [string, "null"]
        priority:
          type: [string, "null"]
        planned_minutes:
          type: [integer, "null"]
        prescription:
          type: [string, "null"]
          description: The athlete-readable rendering of this session's plan, generated by the gateway. Show it; never restate it.
        time_window:
          type: [string, "null"]
        match_status:
          type: [string, "null"]
        plan_kind:
          type: [string, "null"]
          enum: [time_axis, movement_list, unstructured, null]
        workout_name:
          type: [string, "null"]
        delivery_state:
          type: [string, "null"]
    ChangePreview:
      type: object
      description: The exact before and after values of everything this change moves. Show these values to the athlete; never restate the change from memory.
      properties:
        material_change:
          type: boolean
          description: False when the projection moves nothing; then there is nothing to confirm.
        base_version:
          type: integer
        resulting_version:
          type: integer
        goal:
          type: [object, "null"]
          description: Present only when the goal changes.
          properties:
            before:
              type: object
              additionalProperties: true
            after:
              type: object
              additionalProperties: true
        cycle:
          type: [object, "null"]
          description: Present only when the 28-day cycle changes.
          properties:
            before:
              type: object
              additionalProperties: true
            after:
              type: object
              additionalProperties: true
        athlete_baseline:
          type: [object, "null"]
          description: Present only when the baseline changes. Show the moved anchor with the change; it is part of what the athlete confirms.
          properties:
            before:
              type: object
              additionalProperties: true
            after:
              type: object
              additionalProperties: true
        week:
          type: [object, "null"]
          description: Present only when the week start or intent changes.
          properties:
            before:
              type: object
              additionalProperties: true
            after:
              type: object
              additionalProperties: true
        sessions:
          type: array
          items:
            type: object
            properties:
              operation:
                type: string
              session_id:
                type: string
              changed_fields:
                type: array
                items:
                  type: string
              before:
                oneOf:
                  - $ref: "#/components/schemas/ChangePreviewSession"
                  - type: "null"
                description: Null when the session is being added.
              after:
                $ref: "#/components/schemas/ChangePreviewSession"
        weekly_planned_minutes:
          type: object
          properties:
            before:
              type: [integer, "null"]
            after:
              type: [integer, "null"]
        hard_sessions:
          type: object
          properties:
            before:
              type: integer
            after:
              type: integer
    DecisionPrepareRequest:
      type: object
      required:
        - plan_id
        - plan_version
        - context
        - change_request
      properties:
        plan_id:
          type: string
          description: The plan_id from startCoachSession.
        plan_version:
          type: integer
          description: The plan_version from startCoachSession.
        context:
          type: object
          additionalProperties: true
          description: The CoachContext returned by startCoachSession. Opaque -- pass back verbatim.
        change_request:
          $ref: "#/components/schemas/CoachChangeRequest"
    DecisionPrepareResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: string
        base_version:
          type: integer
        resulting_version:
          type: [integer, "null"]
        proposal:
          type: string
          description: Binds this athlete, this context, this plan version and the exact projected change, until expires_at. Pass back unchanged to applyCoachDecision.
        expires_at:
          type: string
          description: After this instant the proposal is refused; re-run prepareCoachDecision to get a fresh one.
        confirmation_required:
          type: boolean
          description: False when nothing material moved; do not ask the athlete to confirm a change that is not one.
        preview:
          $ref: "#/components/schemas/ChangePreview"
        validation:
          $ref: "#/components/schemas/ValidationSummary"
        warnings:
          type: array
          items:
            type: string
        unknowns:
          type: array
          items:
            type: string
    DecisionApplyRequest:
      type: object
      required:
        - plan_id
        - plan_version
        - context
        - change_request
        - proposal
      properties:
        plan_id:
          type: string
        plan_version:
          type: integer
        context:
          type: object
          additionalProperties: true
          description: The exact same CoachContext passed to prepareCoachDecision.
        change_request:
          $ref: "#/components/schemas/CoachChangeRequest"
        proposal:
          type: string
          description: The proposal returned by prepareCoachDecision, unchanged.
        confirmed:
          type: boolean
          description: Must be true whenever prepareCoachDecision returned confirmation_required. Set only after the athlete has confirmed the preview.
    DecisionApplyResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: string
        plan_version:
          type: integer
        event_id:
          type: [string, "null"]
        idempotent_replay:
          type: boolean
          description: True when this exact decision was already committed and this request replayed that prior success.
        validation:
          $ref: "#/components/schemas/ValidationSummary"
    WithdrawalPrepareRequest:
      type: object
      required:
        - plan_id
        - plan_version
        - session_ids
      properties:
        plan_id:
          type: string
        plan_version:
          type: integer
        session_ids:
          type: array
          items:
            type: string
          description: session_id values whose execution.superseded_external_id names an Intervals event the current plan no longer describes.
    WithdrawalPrepareResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: string
        plan_version:
          type: integer
        proposal_id:
          type: string
        proposal_hash:
          type: string
          description: Binds this exact withdrawal set. Pass back unchanged to applyDeliveryWithdrawal.
        confirmation_required:
          type: boolean
        preview:
          type: array
          description: Show this whole batch to the athlete once before asking for the one withdrawal confirmation.
          items:
            type: object
            properties:
              session_id:
                type: string
              scheduled_date:
                type: string
              superseded_external_id:
                type: string
        withdrawal_set:
          type: object
          additionalProperties: true
          description: The full proposal set. Opaque -- pass back verbatim to applyDeliveryWithdrawal unchanged.
    WithdrawalApplyRequest:
      type: object
      required:
        - withdrawal_set
        - proposal_hash
        - confirmed
      properties:
        timezone:
          type: string
          description: The athlete's own IANA timezone, which decides which days count as already past and are therefore never removed. Send the same value you send to startCoachSession; it defaults to Asia/Taipei.
        withdrawal_set:
          type: object
          additionalProperties: true
          description: The exact withdrawal_set returned by prepareDeliveryWithdrawal, unchanged.
        proposal_hash:
          type: string
          description: The exact proposal_hash returned by prepareDeliveryWithdrawal, unchanged.
        confirmed:
          type: boolean
          description: Must be true. Set only after the athlete has confirmed the preview.
    WithdrawalApplyResponse:
      type: object
      properties:
        status:
          type: string
          description: passed when every confirmed event is verified gone; partial when some remain, listed under unresolved.
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: string
        plan_version:
          type: integer
        receipt_id:
          type: string
        proposal_hash:
          type: string
        withdrawn:
          type: array
          items:
            type: object
            properties:
              session_id:
                type: string
              external_id:
                type: string
        unresolved:
          type: array
          description: Sessions whose superseded event could not be verified gone. Empty on a clean withdrawal. Retry the same withdrawal_set and proposal_hash to finish them.
          items:
            type: object
            properties:
              session_id:
                type: string
              error:
                type: string
        attempt_open:
          type: boolean
          description: True when a delete of this withdrawal may have reached Intervals without being confirmed. No plan change is possible while it is true; retrying the same withdrawal_set is what resolves it.
    DeliveryAttemptClearRequest:
      type: object
      required:
        - attempt_id
        - confirmed
      properties:
        attempt_id:
          type: string
          description: The exact attempt_id from delivery.unresolved_delivery in the most recent startCoachSession. If the store now holds a different reservation the request is refused rather than clearing the wrong one.
        confirmed:
          type: boolean
          description: Must be true. Set only after telling the athlete which sessions are unresolved and hearing that they have checked their Intervals calendar.
    DeliveryAttemptClearResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        cleared:
          type: boolean
          description: False when there was no reservation to release, which is the normal answer to a repeated call. Never an error.
        attempt_id:
          type: [string, "null"]
        abandoned:
          type: array
          description: The operations this product has now stopped tracking. Say them back to the athlete; the Intervals calendar is the only remaining record of whether they landed.
          items:
            type: object
            properties:
              session_id:
                type: string
              operation:
                type: string
              state:
                type: string
              external_id:
                type: [string, "null"]
        detail:
          type: string
    DeliveryPrepareRequest:
      type: object
      required:
        - plan_id
        - plan_version
        - session_ids
      properties:
        plan_id:
          type: string
        plan_version:
          type: integer
        session_ids:
          type: array
          items:
            type: string
          description: session_id values from the current PlanState's week.sessions to prepare for delivery.
    DeliveryPrepareResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        plan_id:
          type: string
        plan_version:
          type: integer
        proposal_id:
          type: string
        proposal_hash:
          type: string
          description: Binds this exact delivery set. Pass back unchanged to publishWorkoutDelivery.
        confirmation_required:
          type: boolean
        preview:
          type: array
          description: Show this whole batch to the athlete once before asking for the one delivery confirmation.
          items:
            type: object
            properties:
              session_id:
                type: string
              scheduled_date:
                type: string
              sport:
                type: string
              name:
                type: string
              plan_prescription:
                type: [string, "null"]
              delivered_description:
                type: string
              owned_external_id:
                type: string
              proposal_hash:
                type: string
        delivery_set:
          type: object
          additionalProperties: true
          description: The full proposal set. Opaque -- pass back verbatim to publishWorkoutDelivery unchanged.
    DeliveryPublishRequest:
      type: object
      required:
        - delivery_set
        - proposal_hash
        - confirmed
      properties:
        delivery_set:
          type: object
          additionalProperties: true
          description: The exact delivery_set returned by prepareWorkoutDelivery, unchanged.
        proposal_hash:
          type: string
          description: The exact proposal_hash returned by prepareWorkoutDelivery, unchanged.
        confirmed:
          type: boolean
          description: Must be true. Set only after the athlete has confirmed the preview.
    DeliveryPublishResponse:
      type: object
      properties:
        status:
          type: string
        api_version:
          type: string
        generated_at:
          type: string
        delivery_state:
          type: string
          description: The furthest delivery evidence observed for this publish. Never implies Garmin Connect or the watch received anything.
        max_delivery_state:
          type: string
        plan_id:
          type: string
        plan_version:
          type: integer
        receipt_id:
          type: string
        proposal_hash:
          type: string
        delivered:
          type: array
          items:
            type: object
            properties:
              session_id:
                type: string
              external_id:
                type: string
              owned_external_id:
                type: string
              operation:
                type: string
              delivery_state:
                type: string
        unresolved:
          type: array
          description: Sessions of this set that Intervals does not hold as approved. Empty on a clean delivery. Retry the same delivery_set and proposal_hash to finish them; a newly prepared set is refused until then.
          items:
            type: object
            properties:
              session_id:
                type: string
              scheduled_date:
                type: string
              error:
                type: string
        attempt_open:
          type: boolean
          description: True when Intervals may hold an effect of this delivery that the plan does not record. No plan change is possible while it is true; retrying the same delivery_set is what resolves it.
        state_update:
          type: object
          properties:
            event_id:
              type: [string, "null"]
            idempotent_replay:
              type: boolean
            session_ids:
              type: array
              items:
                type: string
            external_ids:
              type: array
              items:
                type: string
    ErrorResponse:
      type: object
      description: Uniform error envelope for every refused request.
      properties:
        status:
          type: string
          enum: [blocked]
        error:
          type: string
          description: Machine-readable error code.
          enum:
            - unauthorized
            - not_found
            - method_not_allowed
            - invalid_request
            - payload_too_large
            - unsupported_media_type
            - plan_mismatch
            - plan_state_exists
            - stale_plan_version
            - proposal_mismatch
            - proposal_expired
            - proposal_hash_mismatch
            - confirmation_required
            - attempt_mismatch
            - delivery_blocked
            - state_conflict
            - validation_failed
            - context_blocked
            - reconciliation_blocked
            - provider_error
            - internal_error
        detail:
          type: string
          description: Human-readable detail; present for some error codes.
        validation:
          $ref: "#/components/schemas/ValidationSummary"
        reconciliation:
          type: object
          additionalProperties: true
          description: Present when error is reconciliation_blocked; same shape as startCoachSession's reconciliation field.
        current_plan_id:
          type: string
          description: Present when error is plan_mismatch or plan_state_exists.
        current_plan_version:
          type: integer
          description: Present when error is stale_plan_version or plan_state_exists.
        unresolved_delivery:
          type: [object, "null"]
          description: Present when error is attempt_mismatch; the reservation this account actually holds, in the same shape startCoachSession reports.
          additionalProperties: true
      required:
        - status
        - error
